<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oida Opening, Ink Flood</title>
<meta name="description" content="Concept video opening: the δ writes oida, the o floods the frame with ink, and the first line sets in cream.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F3EFE6;
    --ink: #1A1916;        /* drives the δ, the pen, the flood and the type; logo master is #141412 */
    --body: #4A4640;
    --muted: #8F897C;
    --rule: #D9D3C7;
    --flood: 0;            /* 0..1, letterbox follows the frame from cream to ink */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: color-mix(in srgb, var(--ink) calc(var(--flood) * 100%), var(--cream));
    font-family: 'Archivo', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    cursor: default;
  }
  /* Fixed 16:9 stage, 1920x1080 logical px, scaled to fit and centred. */
  #frame {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: 50% 50%;
    background: var(--cream);
    overflow: hidden;
  }
  #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; color: var(--ink); }
  #floodPath { fill: var(--ink); fill-rule: evenodd; }

  /* Title card. */
  #title {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 64px;
    color: var(--cream);
    text-align: center;
    visibility: hidden;
  }
  .hl {
    margin: 0;
    font-weight: 900;
    font-stretch: 108%;
    font-variation-settings: "wdth" 108, "wght" 900;
    font-size: 108px;
    line-height: 0.96;
    letter-spacing: 0;
    text-transform: uppercase;
  }
  /* each line rises out of its own mask; padding keeps the glyphs clear of the clip */
  .m { display: block; overflow: hidden; padding: 0.08em 0.1em 0.06em; margin: -0.08em 0 -0.06em; }
  .l { display: block; will-change: transform; }

  .hint {
    position: fixed; left: 0; right: 0; bottom: 18px; margin: 0; text-align: center;
    font: 400 14px/1 'Archivo', system-ui, sans-serif; letter-spacing: 0.02em;
    color: var(--muted); pointer-events: none;
  }
  html.clean .hint { display: none; }
  #lockup { display: none; }
</style>
</head>
<body>

Q169.00973510742188 160.57546997070312 165.0224609375 149.62049865722656Z"/>

        <ellipse id="ring" cx="142" cy="158" rx="36.06" ry="39.06" transform="rotate(-20 142 158)"/>

</div>

<p class="hint">Click or press space to replay</p>

<script>
(function () {
  var root = document.documentElement;
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  var frameEl = $('frame');
  var stage = $('stage'), world = $('world'), mark = $('mark'), proxy = $('proxy');
  var hook = $('hook'), ring = $('ring'), inkG = $('ink'), thread = $('thread'), ida = $('ida');
  var lockup = $('lockup'), floodPath = $('floodPath'), swallowPath = $('swallowPath'), title = $('title'), b1 = $('b1'), b2 = $('b2');
  var q = location.search;

  var SW = 1920, SH = 1080;
  function fit() {
    var s = Math.min(window.innerWidth / SW, window.innerHeight / SH);
    frameEl.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  fit(); addEventListener('resize', fit);

  var P = { hold: 1.5, speed: 1, size: 50, pen: 'line' };
  var LIFT = false;
  var RECORD = /[?&]record\b/.test(q);
  var LEAD = RECORD ? 1 : 0;                       // ?record: 1 s blank lead-in
  var seekM = /[?&]seek=([\d.]+)/.exec(q);
  if (RECORD || seekM) root.className += ' clean';

  // ---- "ida" clone for the exact end state ----
  var clone = lockup.querySelector('.ida').cloneNode(true);
  clone.removeAttribute('class');

  ida.appendChild(clone);

  cloneDot.parentNode.removeChild(cloneDot);
  var dot = document.createElementNS(NS, 'circle');      // the i's dot: the pen's last tap
  dot.setAttribute('r', '12.6'); dot.setAttribute('fill', 'currentColor');
  world.appendChild(dot);

  // ---- geometry (mark units) ----
  var W = 23.04, HW = W / 2;
  var C = { x: 142, y: 158 };                      // bowl centre = o centre
  var BOWL = { rx: 36.06, ry: 39.06, th: -20 };    // fitted to the official bowl
  var O = { rx: 33.6, ry: 37 };                    // upright o / d / a bowls
  var LOCK = { x: 96.88, y: 65.44, w: 331.86, h: 141.08 };
  var LCX = LOCK.x + LOCK.w / 2, LCY = LOCK.y + LOCK.h / 2;
  var XI = 211.34, XD = 314.28, XA = 417.22, DCX = 280.68, ACX = 383.62;
  var XH = 110.8, ASC = 71.2, BASE = 205.2, MID = 158, DOT = { x: 211.34, y: 82.4 };
  var EXT = 6;                                     // stems run past their cut line so the cut slices straight stem
  var MB = mark.getBBox();
  var MCX = MB.x + MB.width / 2, MCY = MB.y + MB.height / 2;

  // ---- the pen track: one continuous line, root of the hook -> end of the a ----
  // kind: 'hook' (the δ's own stroke, consumed), 'air' (connector, consumed), 'ink' (a letter, persists)

  function addSeg(kind, fn, n, extra) {
    var seg = extra || {};
    seg.kind = kind; seg.i0 = pts.length ? pts.length - 1 : 0;
    var prev = pts.length ? pts[pts.length - 1] : null;
    for (var j = 0; j <= n; j++) {
      var p = fn(j / n);
      if (prev) { var dx = p[0] - prev.x, dy = p[1] - prev.y; var dl = Math.sqrt(dx * dx + dy * dy); if (j === 0) continue; p = { x: p[0], y: p[1], s: prev.s + dl }; }
      else p = { x: p[0], y: p[1], s: 0 };
      pts.push(p); prev = p;
    }
    seg.i1 = pts.length - 1; seg.s0 = pts[seg.i0].s; seg.s1 = pts[seg.i1].s;
    segs.push(seg); return seg;
  }
  function cubic(a, b, c, d) {
    return function (u) {

  function line(a, b) { return function (u) { return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]; }; }

  addSeg('air', cubic([XI, BASE], [XI, BASE + 44], [XD, BASE + 44], [XD, BASE]), 260);         // the cradle under the d

  addSeg('ink', loop(DCX, -1), 480, { bowl: DCX });                                            // d bowl, counter-clockwise
  addSeg('ink', line([XD, MID], [XD, ASC - EXT]), 200, { stem: XD, cut: ASC });                // d ascender, up
  addSeg('air', cubic([XD, ASC - EXT], [XD, ASC - 46], [XA, XH - 66], [XA, XH - EXT]), 260);   // the arch over to the a
  addSeg('ink', line([XA, XH - EXT], [XA, MID]), 120, { stem: XA, cut: XH });                  // a stem, down to the bowl
  addSeg('ink', loop(ACX, 1), 480, { bowl: ACX });                                             // a bowl, clockwise
  addSeg('ink', line([XA, MID], [XA, BASE]), 100, { stem: XA });                               // a stem, down to the line

    else { sg.el = document.createElementNS(NS, 'path'); sg.el.setAttribute('fill', 'none'); sg.el.setAttribute('stroke', 'currentColor');

  var RAMP = 0.3;

    var vmax = 1 / (1 - RAMP);
    return function (u) {

  function stemPoly(x, y0, y1, cut) {

  T.write = [0.4 + P.hold, 0.4 + P.hold + D];
  T.dot = [T.write[1] - 0.02, T.write[1] + 0.2];      // the pen's last tap

  T.essay = [1e9, 1e9 + 1];
  T.end = T.dot[1] + 0.05;                           // rest on the finished "oida"

  function mapping(k, ax, ay, sx, sy) { return { k: k, tx: sx - k * ax, ty: sy - k * ay }; }

  function layout() {
    var vw = SW, vh = SH;
    var cx = vw / 2, cy = vh * 0.48;
    var k1 = Math.min(vh * P.size / 100, vw * 0.4) / MB.height;   // δ height = size% of the frame height
    var k2 = Math.min(k1 * 0.92, vw * 0.84 / LOCK.w);
    return { k1: k1, k2: k2, cx: cx, cy: cy };
  }

  // ================= the ink flood + title (new) =================
  var FLOOD = 1.25;
  T.flood = [T.end + 0.6, T.end + 0.6 + FLOOD];
  var RISE = 1.1, STAG = 0.16;
  T.l1 = T.flood[1] + 0.35;                 // line 1 starts rising
  T.l2 = T.l1 + RISE + STAG + 1.2;          // line 2 starts after line 1 has held ~1.2 s
  T.final = T.l2 + RISE + STAG;             // both lines settled
  var lines = title.querySelectorAll('.l');
  var lineStart = [T.l1, T.l1 + STAG, T.l2, T.l2 + STAG];

  var OUT = { rx: O.rx + HW, ry: O.ry + HW }, INN = { rx: O.rx - HW, ry: O.ry - HW };
  var COVER_AT = 0.9;                       // fraction of the flood at which the outer edge clears the last corner
  var out4 = function (u) { return 1 - Math.pow(1 - u, 4); };
  var smooth = function (u) { return u * u * (3 - 2 * u); };
  function ellD(cx, cy, rx, ry) {
    return 'M' + f(cx - rx) + ' ' + f(cy) + 'a' + f(rx) + ' ' + f(ry) + ' 0 1 0 ' + f(2 * rx) + ' 0a' + f(rx) + ' ' + f(ry) + ' 0 1 0 ' + f(-2 * rx) + ' 0Z';
  }
  function coverR(cx, cy, ax) {             // vertical semi-axis needed to cover all four corners
    var r = 0, cs = [[0, 0], [SW, 0], [0, SH], [SW, SH]];
    for (var i = 0; i < 4; i++) { var dx = (cs[i][0] - cx) / ax, dy = cs[i][1] - cy; r = Math.max(r, Math.sqrt(dx * dx + dy * dy)); }
    return r;
  }
  var growEase = function (u) { u = clamp01(u); return u < 0.5 ? 0.5 * Math.pow(2 * u, 2.4) : 1 - 0.5 * Math.pow(2 - 2 * u, 2.4); };   // accelerate, then settle
  var driftEase = function (u) { return inOutSine(clamp01(u / COVER_AT)); };
  function floodState(u, k, ox, oy) {
    var ax = OUT.rx / OUT.ry;
    var cx = lerp(ox, SW / 2, driftEase(u)), cy = lerp(oy, SH / 2, driftEase(u));
    var r0 = k * OUT.ry;
    var rc = coverR(SW / 2, SH / 2, ax) * 1.01;
    // grow in log space so the swell reads as one continuous scale change; clears the corners at COVER_AT
    var gC = growEase(COVER_AT);
    var lnR = Math.log(r0) + (Math.log(rc) - Math.log(r0)) * growEase(u) / gC;
    var R = Math.exp(lnR);
    // the counter: a breath of swell, then it fills in, closing to a point at the end
    // it swells with the letter at first, then fills in, reaching a point just as the last corner goes under
    // revised 2026-10-14: the counter closes early, while the o is still letter-sized, so the o reads as filling in
    // (becoming a full stop) and the screen never shows a big disc with a small centred hole (an eye / lens read)
    var ri = k * INN.ry * Math.pow(R / r0, 0.5) * Math.pow(1 - smooth(clamp01(u / 0.3)), 1.2);
    return { cx: cx, cy: cy, R: R, ax: ax, ri: ri, bx: INN.rx / INN.ry };
  }

  function render(t) {
    t -= LEAD;
    var L = layout();
    var started = t >= T.write[0];
    var head = started ? headAt(t) : HEAD0;
    var tail = tailAt(head);
    var done = t >= T.write[1];

    // camera: δ centred -> lockup centred, paced by the pen
    var wNow = started ? penEase(prog(t, T.write)) : 0;
    var uC = inOutSine(clamp01(wNow / camFrac));
    var m = mapping(lerp(L.k1, L.k2, uC), lerp(MCX, LCX, uC), lerp(MCY, LCY, uC), L.cx, L.cy);
    world.setAttribute('transform', 'translate(' + f(m.tx) + ' ' + f(m.ty) + ') scale(' + m.k + ')');
    world.style.opacity = out3(prog(t, T.fade));

    mark.style.visibility = started ? 'hidden' : 'visible';
    proxy.style.visibility = started ? 'visible' : 'hidden';

    var uB = inOut3(prog(t, T.bowl));
    ring.setAttribute('rx', lerp(BOWL.rx, O.rx, uB)); ring.setAttribute('ry', lerp(BOWL.ry, O.ry, uB));
    ring.setAttribute('transform', 'rotate(' + lerp(BOWL.th, 0, uB) + ' ' + C.x + ' ' + C.y + ')');

    var d = '';
    if (started && !done) d = polyD(tail, head);
    thread.setAttribute('d', d);

    for (var j = 0; j < segs.length; j++) {
      var g = segs[j]; if (g.kind !== 'ink') continue;
      if (done || head <= g.s0) { g.el.style.display = 'none'; continue; }
      g.el.style.display = '';
      var e = Math.min(head, g.s1);
      if (g.stem) g.el.setAttribute('points', stemPoly(g.stem, pts[g.i0].y, ptAt(e).y, g.cut));
      else g.el.setAttribute('d', polyD(g.s0, e) + (head >= g.s1 ? 'Z' : ''));
    }
    ida.style.visibility = done ? 'visible' : 'hidden';

    var uD = prog(t, T.dot);
    dot.style.display = uD > 0 ? '' : 'none';
    dot.setAttribute('cx', DOT.x); dot.setAttribute('cy', DOT.y);
    dot.setAttribute('r', f(12.6 * (0.35 + 0.65 * out3(uD))));
    dot.style.opacity = clamp01(uD * 8);

    // ---- the flood ----
    var flooding = t >= T.flood[0];
    var uF = prog(t, T.flood);
    var full = uF >= 1;
    ring.style.visibility = flooding ? 'hidden' : '';
    world.style.display = full ? 'none' : '';
    if (flooding && !full) {
      var st = floodState(uF, m.k, m.tx + m.k * C.x, m.ty + m.k * C.y);
      var dd = ellD(st.cx, st.cy, st.R * st.ax, st.R);
      swallowPath.setAttribute('d', dd);
      if (st.ri > 0.05) dd += ellD(st.cx, st.cy, st.ri * st.bx, st.ri);
      floodPath.setAttribute('d', dd);
      floodPath.style.display = '';
    } else { floodPath.style.display = 'none'; swallowPath.setAttribute('d', ''); }
    frameEl.style.background = full ? 'var(--ink)' : 'var(--cream)';
    root.style.setProperty('--flood', f(full ? 1 : smooth(clamp01(uF / COVER_AT))));

    // ---- the title: each line rises out of its mask ----
    title.style.visibility = full ? 'visible' : 'hidden';
    // line 1 holds at the optical centre alone, then eases up to make room as line 2 rises
    var shift = (b2.offsetHeight + 64) / 2;
    var uS = inOutSine(clamp01((t - T.l2) / (RISE + STAG)));
    b1.style.transform = 'translateY(' + f(shift * (1 - uS)) + 'px)';
    b2.style.transform = 'translateY(' + f(shift * (1 - uS)) + 'px)';
    for (var li = 0; li < lines.length; li++) {
      var uL = clamp01((t - lineStart[li]) / RISE);
      var y = 1 - out4(uL);
      lines[li].style.transform = 'translateY(' + f(y * 108) + '%)';
      lines[li].style.opacity = '';             // crisp: the mask alone reveals each line (no grey fade)
    }
  }
  var T_END = T.final + LEAD;

  window.__oida = { T: T, LEAD: LEAD };

  // ?seek=4.2 freezes the timeline at that moment (frame captures).
  if (seekM) {
    var tsk = parseFloat(seekM[1]);
    render(tsk);
    return;
  }

  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (reduce) { render(T_END); return; }

  var LOOP = /[?&]loop\b/.test(q), t0 = null, running = false, loopTimer = null;
  function frame(now) {
    if (t0 === null) t0 = now;
    var tNow = (now - t0) / 1000;
    if (tNow >= T_END) {
      render(T_END); running = false;
      if (LOOP) loopTimer = setTimeout(play, 2000);
      return;
    }
    render(tNow);
    requestAnimationFrame(frame);
  }
  function play() {
    clearTimeout(loopTimer); t0 = null;
    if (!running) { running = true; requestAnimationFrame(frame); }
  }
  addEventListener('pointerdown', function () { play(); });
  addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); play(); } });
  render(0);
  // start once the type is ready, so the title never sets in a fallback face
  var go = function () { play(); };
  if (document.fonts && document.fonts.load) {
    Promise.race([document.fonts.load('900 108px Archivo'), new Promise(function (r) { setTimeout(r, 1500); })]).then(go, go);
  } else go();
})();
</script>
</body>
</html>
