<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oida Unbroken Line</title>
<meta name="description" content="Video opening: the δ writes oida, the pen never stops, its line becomes the ground the first slide stands on.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F3EFE6;
    --ink: #1A1916;          /* drives the δ, the pen, the line and the type (logo master: #141412) */
    --body: #4A4640;
    --muted: #8F897C;
    --rule: #D9D3C7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--cream); }
  body { -webkit-font-smoothing: antialiased; }

  /* Fixed 1920x1080 stage, scaled to fit and centred; the letterbox is the same cream. */
  #frame {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: 0 0;
    background: var(--cream);
    color: var(--ink);
    overflow: hidden;
  }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; color: var(--ink); }

  /* Headlines: Archivo 900, width 108, uppercase. Each line sits in a mask whose floor is the line. */
  .mask {
    position: absolute; left: 0; width: 1920px;
    overflow: hidden;
  }
  .head {
    display: block; margin: 0;
    font-family: 'Archivo', 'Arial Black', sans-serif;
    font-weight: 900;
    font-stretch: 108%;
    font-variation-settings: 'wdth' 108, 'wght' 900;
    text-transform: uppercase;
    letter-spacing: 0;
    line-height: 0.96;
    color: var(--ink);
    text-align: center;
    white-space: nowrap;
    will-change: transform;
  }

  #lockupTpl { display: none; }
  .hint { position: fixed; left: 0; right: 0; bottom: 14px; margin: 0; text-align: center; z-index: 20;
          font: 500 11px/1 'Archivo', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  html.record .hint, html.seek .hint { display: none; }
</style>
</head>
<body>

<div id="frame">
  <svg id="stage" viewBox="0 0 1920 1080" aria-hidden="true" focusable="false">
    <defs>

      <linearGradient id="fadeGrad" gradientUnits="userSpaceOnUse" x1="429" y1="0" x2="677" y2="0">
        <stop id="lf0" offset="0" stop-color="#fff"/>
        <stop offset="1" stop-color="#fff"/>
      </linearGradient>

        <rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#fadeGrad)"/>
      </mask>
    </defs>
    <g id="world" style="opacity:0">
      <g id="word">

        <!-- Stroked stand-in for the mark (centerline fit, max error ~1 unit). -->
        <g id="proxy" fill="none" stroke="currentColor" stroke-width="23.04" style="visibility:hidden">
          <path id="hook" style="display:none" d="M156.00 70.00 C153.32 68.66 150.47 67.62 147.59 66.85 C144.71 66.09 141.69 65.63 138.72 65.42 C135.74 65.20 132.70 65.24 129.73 65.56 C126.76 65.87 123.77 66.44 120.92 67.29 C118.06 68.14 115.19 69.23 112.59 70.66 C109.98 72.09 107.40 73.81 105.29 75.88 C103.19 77.95 101.19 80.42 99.970 83.07 C98.75 85.72 98.07 88.87 98.00 91.77 C97.92 94.67 98.47 97.75 99.51 100.47 C102.0 107.0 112.6 117.6 130.0 121.6"/>
          <ellipse id="ring" cx="142" cy="158" rx="36.06" ry="39.06" transform="rotate(-20 142 158)"/>
        </g>
        <!-- The pen: letters it has written (persist) and the travelling thread (consumed behind it). -->
        <g id="ink" fill="currentColor" stroke="none"></g>
        <path id="thread" fill="none" stroke="currentColor" stroke-width="23.04" stroke-linecap="butt" stroke-linejoin="round"/>
        <!-- Exact copy of the lockup's "ida", swapped in the moment the pen finishes. -->
        <g id="ida" style="visibility:hidden"></g>
      </g>
      <!-- The unbroken line: the pen leaves the foot of the a and keeps going. -->
      <path id="line" fill="currentColor" stroke="none" d=""/>
    </g>
  </svg>

  <div class="mask" id="m1"><p class="head" id="h1">Every job site has a story.</p></div>
  <div class="mask" id="m2"><p class="head" id="h2">Most of the time<br>nobody can prove it.</p></div>
</div>

<!-- Lockup geometry template (never shown): stroke 23.04 = the δ's stroke. -->
<svg id="lockupTpl" viewBox="96.88 65.44 331.86 141.08" aria-hidden="true">
  <g class="ida">
    <polygon class="solid" points="199.82,116.56 222.86,105.04 222.86,205.2 199.82,205.2"/>
    <circle class="solid dot" cx="211.34" cy="82.4" r="12.6"/>
    <ellipse cx="280.68" cy="158" rx="33.6" ry="37"/>
    <polygon class="solid" points="302.76,76.96 325.8,65.44 325.8,205.2 302.76,205.2"/>
    <ellipse cx="383.62" cy="158" rx="33.6" ry="37"/>
    <polygon class="solid" points="405.7,116.56 428.74,105.04 428.74,205.2 405.7,205.2"/>
  </g>
</svg>

<p class="hint">Click or press space to replay</p>

<script>
(function () {
  var root = document.documentElement;
  var q = location.search;
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  var frameEl = $('frame'), world = $('world'), word = $('word'), mark = $('mark');
  var proxy = $('proxy'), hook = $('hook'), ring = $('ring'), inkG = $('ink'), thread = $('thread'), ida = $('ida');
  var lineEl = $('line'), lf0 = $('lf0');
  var m1 = $('m1'), m2 = $('m2'), h1 = $('h1'), h2 = $('h2');

  var RECORD = /[?&]record\b/.test(q);
  var LOOP = /[?&]loop\b/.test(q);
  var seekM = /[?&]seek=([\d.]+)/.exec(q);
  if (RECORD) root.className += ' record';
  if (seekM) root.className += ' seek';
  var LEAD = RECORD ? 1 : 0;              // ?record: 1 s of blank cream before the δ fades in

  // ---- fit the 1920x1080 stage to the window ----
  var SW = 1920, SH = 1080;
  function fit() {
    var s = Math.min(window.innerWidth / SW, window.innerHeight / SH);
    frameEl.style.transform = 'scale(' + s + ') translate(-50%, -50%)';
  }
  fit(); addEventListener('resize', fit);

  // ==== LOGO ANIMATION (unchanged from animation.html; stage = 1920x1080, size 50, hold 1.5, speed 1, one line) ====
  var P = { hold: 1.5, speed: 1, size: 50 };

  var clone = $('lockupTpl').querySelector('.ida').cloneNode(true);
  clone.removeAttribute('class');
  ida.setAttribute('stroke-width', '23.04'); ida.setAttribute('fill', 'none'); ida.setAttribute('stroke', 'currentColor');
  ida.appendChild(clone);
  var solids = clone.querySelectorAll('.solid');
  for (var si = 0; si < solids.length; si++) { solids[si].setAttribute('fill', 'currentColor'); solids[si].setAttribute('stroke', 'none'); }
  var cloneDot = clone.querySelector('.dot');
  cloneDot.parentNode.removeChild(cloneDot);
  var dot = document.createElementNS(NS, 'circle');      // the i's dot: the pen's last tap
  dot.setAttribute('r', '12.6'); dot.setAttribute('fill', 'currentColor');
  word.appendChild(dot);

  var W = 23.04, HW = W / 2;
  var C = { x: 142, y: 158 };
  var BOWL = { rx: 36.06, ry: 39.06, th: -20 };
  var O = { rx: 33.6, ry: 37 };
  var LOCK = { x: 96.88, y: 65.44, w: 331.86, h: 141.08 };
  var LCX = LOCK.x + LOCK.w / 2, LCY = LOCK.y + LOCK.h / 2;
  var XI = 211.34, XD = 314.28, XA = 417.22, DCX = 280.68, ACX = 383.62;
  var XH = 110.8, ASC = 71.2, BASE = 205.2, MID = 158, DOT = { x: 211.34, y: 82.4 };
  var EXT = 6;
  var MB = mark.getBBox();
  var MCX = MB.x + MB.width / 2, MCY = MB.y + MB.height / 2;

  var STEP = 0.5, pts = [], segs = [];
  function addSeg(kind, fn, n, extra) {
    var seg = extra || {};
    seg.kind = kind; seg.i0 = pts.length ? pts.length - 1 : 0;
    var prev = pts.length ? pts[pts.length - 1] : null;
    for (var j = 0; j <= n; j++) {
      var p = fn(j / n);
      if (prev) { var dx = p[0] - prev.x, dy = p[1] - prev.y; var dl = Math.sqrt(dx * dx + dy * dy); if (j === 0) continue; p = { x: p[0], y: p[1], s: prev.s + dl }; }
      else p = { x: p[0], y: p[1], s: 0 };
      pts.push(p); prev = p;
    }
    seg.i1 = pts.length - 1; seg.s0 = pts[seg.i0].s; seg.s1 = pts[seg.i1].s;
    segs.push(seg); return seg;
  }
  function cubic(a, b, c, d) {
    return function (u) {
      var v = 1 - u;
      return [v * v * v * a[0] + 3 * v * v * u * b[0] + 3 * v * u * u * c[0] + u * u * u * d[0],
              v * v * v * a[1] + 3 * v * v * u * b[1] + 3 * v * u * u * c[1] + u * u * u * d[1]];
    };

  function line(a, b) { return function (u) { return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]; }; }

    return function (u) { var th = dir * u * 2 * Math.PI; return [cx + O.rx * Math.cos(th), MID + O.ry * Math.sin(th)]; };
  }
  var HL = hook.getTotalLength();
  addSeg('hook', function (u) { var p = hook.getPointAtLength(HL * (1 - u)); return [p.x, p.y]; }, Math.ceil(HL / STEP));
  var TERM = [156, 70], TD = [0.894, 0.447];
  var iTop = XH - EXT;
  addSeg('air', cubic(TERM, [TERM[0] + 30 * TD[0], TERM[1] + 30 * TD[1]], [XI, iTop - 18], [XI, iTop]), 140, { lead: true });
  addSeg('ink', line([XI, iTop], [XI, BASE]), 200, { stem: XI, cut: XH });
  addSeg('air', cubic([XI, BASE], [XI, BASE + 44], [XD, BASE + 44], [XD, BASE]), 260);
  addSeg('ink', line([XD, BASE], [XD, MID]), 100, { stem: XD });
  addSeg('ink', loop(DCX, -1), 480, { bowl: DCX });
  addSeg('ink', line([XD, MID], [XD, ASC - EXT]), 200, { stem: XD, cut: ASC });
  addSeg('air', cubic([XD, ASC - EXT], [XD, ASC - 46], [XA, XH - 66], [XA, XH - EXT]), 260);
  addSeg('ink', line([XA, XH - EXT], [XA, MID]), 120, { stem: XA, cut: XH });
  addSeg('ink', loop(ACX, 1), 480, { bowl: ACX });
  addSeg('ink', line([XA, MID], [XA, BASE]), 100, { stem: XA });
  var TOTAL = pts[pts.length - 1].s;

  for (var k = 0; k < segs.length; k++) { var sg = segs[k]; sg.w = sg.kind === 'hook' ? 0 : 1; }
  var WT = [0]; for (k = 0; k < segs.length; k++) WT.push(WT[k] + segs[k].w * (segs[k].s1 - segs[k].s0));
  var WTOT = WT[WT.length - 1];
  function sAtWeighted(wv) {
    for (var j = 0; j < segs.length; j++) {
      if (wv <= WT[j + 1] || j === segs.length - 1) {
        var g = segs[j]; if (g.w === 0) continue;
        return g.s0 + Math.min(1, Math.max(0, (wv - WT[j]) / (WT[j + 1] - WT[j]))) * (g.s1 - g.s0);
      }

    return TOTAL;
  }
  for (k = 0; k < segs.length; k++) {
    sg = segs[k];

    if (sg.stem) { sg.el = document.createElementNS(NS, 'polygon'); }
    else { sg.el = document.createElementNS(NS, 'path'); sg.el.setAttribute('fill', 'none'); sg.el.setAttribute('stroke', 'currentColor');
           sg.el.setAttribute('stroke-width', W); sg.el.setAttribute('stroke-linecap', 'butt'); sg.el.setAttribute('stroke-linejoin', 'round'); }
    inkG.appendChild(sg.el);

  var clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
  var prog = function (t, r) { return clamp01((t - r[0]) / (r[1] - r[0])); };
  var lerp = function (a, b, u) { return a + (b - a) * u; };
  var inOut3 = function (u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
  var inOutSine = function (u) { return 0.5 - 0.5 * Math.cos(Math.PI * u); };
  var out3 = function (u) { return 1 - Math.pow(1 - u, 3); };
  var RAMP = 0.3;
  var penEase = (function () {
    var vmax = 1 / (1 - RAMP);
    return function (u) {
      if (u <= 0) return 0; if (u >= 1) return 1;
      var r = RAMP;
      var ramp = function (x) { return vmax * (x - r / Math.PI * Math.sin(Math.PI * x / r)) / 2; };
      if (u < r) return ramp(u);
      if (u > 1 - r) return 1 - ramp(1 - u);
      return ramp(r) + vmax * (u - r);

    var lo = 0, hi = pts.length - 1;
    while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (pts[mid].s <= s) lo = mid; else hi = mid; }
    return lo;
  }
  function ptAt(s) {
    var i = idxAt(s), a = pts[i], b = pts[Math.min(i + 1, pts.length - 1)];
    var u = b.s > a.s ? (s - a.s) / (b.s - a.s) : 0;

    if (s1 - s0 < 0.05) return '';
    var a = ptAt(s0), d = 'M' + f(a.x) + ' ' + f(a.y);

    var top = Math.min(y0, y1), bot = Math.max(y0, y1);
    var poly = [[x - HW, top], [x + HW, top], [x + HW, bot], [x - HW, bot]];
    if (cut != null) {
      var inside = function (p) { return p[1] >= cut - 0.5 * (p[0] - x) - 1e-6; };
      var out = [];
      for (var i = 0; i < poly.length; i++) {

        if (ia) out.push(A);
        if (ia !== ib) {

  var T = {};

  T.write = [0.4 + P.hold, 0.4 + P.hold + D];          // 1.90 - 3.85
  T.dot = [T.write[1] - 0.02, T.write[1] + 0.2];      // 3.83 - 4.05: the pen's last tap

  var HEAD0 = HL;
  function headAt(t) { return sAtWeighted(penEase(prog(t, T.write)) * WTOT); }
  var LW = HL + 34;
  function tailAt(h) { return Math.max(0, h - LW); }
  var tLetGo = T.write[1];
  for (var ts = T.write[0]; ts < T.write[1]; ts += 0.005) { if (tailAt(headAt(ts)) > 22) { tLetGo = ts; break; } }
  T.bowl = [tLetGo, tLetGo + 0.6 * D];
  var sA = segs[segs.length - 3].s0;
  var wA = (function () { for (var j = 0; j < segs.length; j++) if (segs[j].s0 >= sA - 0.01) return WT[j]; return WTOT; })();
  var camFrac = wA / WTOT;

  function mapping(k, ax, ay, sx, sy) { return { k: k, tx: sx - k * ax, ty: sy - k * ay }; }

  var K2 = Math.min(K1 * 0.92, SW * 0.84 / LOCK.w);

  // ==== THE UNBROKEN LINE ====
  // The pen sets off again from the foot of the a and runs out to the right, level with the baseline: the line's
  // lower edge IS the baseline, so the word stands on it. Its weight eases from the full stroke to a fine rule over
  // TAPER units (the lower edge stays on the baseline); the camera pulls back and pans with it.
  var X0 = XA + HW;                             // the line leaves the right edge of the a's stem
  var TAPER = 230;                              // units over which the weight falls to the rule
  $('fadeGrad').setAttribute('x1', X0); $('fadeGrad').setAttribute('x2', X0 + TAPER);
  var KF = 1.12;                                // final camera scale
  var RULE_PX = 4;                              // final rule weight on the 1920 stage
  var WF = RULE_PX / KF;                        // rule weight in mark units
  var LY = BASE - WF / 2;                       // the settled rule's centre, mark units
  var RULE_Y = 655;                             // final rule centre on the stage (px)
  var A_FINAL = -420;                           // the foot of the a ends this far off the left edge (px)
  var FINAL = mapping(KF, XA, LY, A_FINAL, RULE_Y);

  var HEAD_END = SW + 260;                      // the pen leaves the frame on the right

  T.run = [T.hold[1], T.hold[1] + 2.9];         // 4.55 - 7.45: the pen runs, the camera pulls back
  T.cam = [T.hold[1] + 0.15, T.hold[1] + 3.05]; // the camera answers the pen a beat late
  T.wordOut = [T.hold[1] + 0.9, T.hold[1] + 2.3];
  T.l1 = [T.run[0] + 2.65, T.run[0] + 3.75];    // 7.20 - 8.30: line 1 rises out of the line
  T.l2 = [T.l1[1] + 1.2, T.l1[1] + 2.3];        // 9.50 - 10.60: line 2 rises, line 1 steps up
  T.end = T.l2[1];

    return lerp(W, WF, inOutSine(clamp01(s / TAPER)));
  }
  function linePath(sHead) {
    if (sHead <= 0.05) return '';
    var top = [];
    for (var s = 0; s < Math.min(sHead, TAPER); s += 1.5) top.push(f(X0 + s) + ' ' + f(BASE - widthAt(s)));
    top.push(f(X0 + Math.min(sHead, TAPER)) + ' ' + f(BASE - widthAt(Math.min(sHead, TAPER))));
    if (sHead > TAPER) top.push(f(X0 + sHead) + ' ' + f(BASE - WF));
    // start 0.6 units inside the stem so there is no seam at the foot of the a
    return 'M' + f(X0 - 0.6) + ' ' + f(BASE - W) + 'L' + top.join('L') +
           'L' + f(X0 + sHead) + ' ' + BASE + 'L' + f(X0 - 0.6) + ' ' + BASE + 'Z';
  }
  function camAt(t) {
    var u = inOutSine(prog(t, T.cam));          // gentle peak: the pan never whips
    // zoom in log space so the pull-back feels even; the a's foot travels on a straight line between framings
    var k = Math.exp(lerp(Math.log(K2), Math.log(KF), u));
    var ax = lerp(LOCKED.tx + K2 * XA, FINAL.tx + KF * XA, u);
    var ay = lerp(LOCKED.ty + K2 * LY, FINAL.ty + KF * LY, u);
    return { k: k, tx: ax - k * XA, ty: ay - k * LY };
  }
  function headS(t, cam) {                       // the pen's screen x is eased; its track position follows
    var v = prog(t, T.run);
    var e = v < 0.5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2;   // soft start, soft hand-off
    e = lerp(e, inOutSine(v), 0.5);
    var hs = lerp(HEAD_START, HEAD_END, e);
    var xw = (hs - cam.tx) / cam.k;              // world x under the pen
    return Math.max(0, xw - X0);
  }

  // ==== HEADLINES ====
  var FS = 94;                                   // headline size, px on the 1920 stage (line 1 spans ~1660 px)
  var LH = FS * 0.96;
  var BEAT = 0.4 * LH;                           // a breath between the two statements
  var G = 6;                                      // line box bottom -> top of the rule (baseline sits ~0.15em higher)
  h1.style.fontSize = FS + 'px'; h2.style.fontSize = FS + 'px';
  var maskBottom = RULE_Y - RULE_PX / 2;         // the masks stand on the rule
  function placeMask(m, bottom, height) { m.style.top = (bottom - height) + 'px'; m.style.height = height + 'px'; }

  // ==== RENDER ====
  function render(t) {
    var started = t >= T.write[0];
    var head = started ? headAt(t) : HEAD0;
    var tail = tailAt(head);
    var done = t >= T.write[1];

    // camera: δ centred -> lockup centred (logo animation), then the pull-back along the line
    var m;
    if (t < T.cam[0]) {
      var wNow = started ? penEase(prog(t, T.write)) : 0;
      var uC = inOutSine(clamp01(wNow / camFrac));
      m = mapping(lerp(K1, K2, uC), lerp(MCX, LCX, uC), lerp(MCY, LCY, uC), CX, CY);
    } else m = camAt(t);
    world.setAttribute('transform', 'translate(' + f(m.tx) + ' ' + f(m.ty) + ') scale(' + m.k + ')');
    world.style.opacity = out3(prog(t, T.fade));

    mark.style.visibility = started ? 'hidden' : 'visible';
    proxy.style.visibility = started ? 'visible' : 'hidden';

    var uB = inOut3(prog(t, T.bowl));
    ring.setAttribute('rx', lerp(BOWL.rx, O.rx, uB)); ring.setAttribute('ry', lerp(BOWL.ry, O.ry, uB));
    ring.setAttribute('transform', 'rotate(' + lerp(BOWL.th, 0, uB) + ' ' + C.x + ' ' + C.y + ')');

    thread.setAttribute('d', started && !done ? polyD(tail, head) : '');

    for (var j = 0; j < segs.length; j++) {
      var g = segs[j]; if (g.kind !== 'ink') continue;
      if (done || head <= g.s0) { g.el.style.display = 'none'; continue; }
      g.el.style.display = '';
      var e = Math.min(head, g.s1);
      if (g.stem) g.el.setAttribute('points', stemPoly(g.stem, pts[g.i0].y, ptAt(e).y, g.cut));
      else g.el.setAttribute('d', polyD(g.s0, e) + (head >= g.s1 ? 'Z' : ''));
    }
    ida.style.visibility = done ? 'visible' : 'hidden';

    var uD = prog(t, T.dot);
    dot.style.display = uD > 0 ? '' : 'none';
    dot.setAttribute('cx', DOT.x); dot.setAttribute('cy', DOT.y);
    dot.setAttribute('r', f(12.6 * (0.35 + 0.65 * out3(uD))));
    dot.style.opacity = clamp01(uD * 8);

    // the unbroken line
    var sHead = t > T.run[0] ? headS(t, m) : 0;
    lineEl.setAttribute('d', linePath(sHead));
    var wo = 1 - inOutSine(prog(t, T.wordOut));     // the word recedes; the line's first stretch goes with it
    lf0.setAttribute('stop-opacity', f(wo));
    if (wo < 1) world.setAttribute('mask', 'url(#fadeMask)'); else world.removeAttribute('mask');

    // headlines rise out of the line
    var u1 = inOut3(prog(t, T.l1)), u2 = inOut3(prog(t, T.l2));
    var mh = LH + 40;                               // mask tall enough for the caps, floor = the rule
    placeMask(m2, maskBottom, mh + LH);           // line 2 is set on two lines
    var STEP_UP = 2 * LH + BEAT;                  // line 1 makes room for both lines of line 2
    placeMask(m1, maskBottom, mh + STEP_UP * u2);
    // line 1: rises out of the rule, then steps up one line as line 2 comes out under it
    h1.style.transform = 'translateY(' + f(mh - LH - G + (1 - u1) * (LH + G + 4)) + 'px)';
    h2.style.transform = 'translateY(' + f(mh - LH - G + (1 - u2) * (2 * LH + G + 4)) + 'px)';
    m1.style.visibility = u1 > 0 ? 'visible' : 'hidden';
    m2.style.visibility = u2 > 0 ? 'visible' : 'hidden';
  }

  // ==== PLAYBACK ====
  window.__oida = { T: T, render: render };
  function drawAt(tt) { render(tt - LEAD); }

  if (seekM) {                                   // ?seek=4.2 freezes the piece at that moment (frame captures)
    var tsk = parseFloat(seekM[1]);
    drawAt(tsk);
    if (document.fonts) document.fonts.ready.then(function () { drawAt(tsk); });
    return;
  }
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (reduce) { render(T.end); return; }

  var t0 = null, running = false, loopTimer = null;
  function frame(now) {
    if (t0 === null) t0 = now;
    var tt = (now - t0) / 1000;
    if (tt - LEAD >= T.end) {
      render(T.end); running = false;
      if (LOOP) loopTimer = setTimeout(play, 2000);
      return;
    }
    drawAt(tt);
    requestAnimationFrame(frame);
  }
  function play() {
    clearTimeout(loopTimer); t0 = null;
    if (!running) { running = true; requestAnimationFrame(frame); }
  }
  addEventListener('pointerdown', play);
  addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); play(); } });
  drawAt(0);
  // start once the headline face is in (it is needed at 7 s, but never let a fallback flash in)
  var began = false, go = function () { if (!began) { began = true; play(); } };
  if (document.fonts && document.fonts.load) {
    var timer = setTimeout(go, 1500);
    document.fonts.load('900 94px Archivo').then(function () { clearTimeout(timer); go(); }, function () { clearTimeout(timer); go(); });
  } else go();
})();
</script>
