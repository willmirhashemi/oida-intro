<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oida Platform</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F2EFE8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,opsz,wght@0,8..30,300..700;1,8..30,300..500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one top bar with three tabs; each screen is a single editorial column, like the deck.
     Paper and ink, one stamp colour. Deliberately single-theme: the brand is ink on paper. */
  :root {
    --paper: #F2EFE8;
    --sand: #E6E0D3;
    --ink: #121210;
    --type: #16150F;
    --quiet: #5A574F;
    --faint: #8F897C;
    --hairline: #D6D0C3;
    --on-ink: #EDEDEA;
    --quiet-dark: #9B978D;
    --stamp: #D8613C;
    --ok: #4F6B4A;
    --serif: 'Piazzolla', Georgia, 'Times New Roman', serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    --ease: cubic-bezier(.2, .7, .2, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--paper); color: var(--type); }
  body { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-optical-sizing: auto; }
  ::selection { background: var(--ink); color: var(--paper); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .mono, .label { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .label { color: var(--quiet); }
  .tc { font-family: var(--mono); font-size: 13px; color: var(--quiet); letter-spacing: 0; }

  /* ---------- top bar ---------- */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--hairline); }
  .top-in { max-width: 1240px; margin: 0 auto; padding: 0 24px; height: 60px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  .wm { display: inline-flex; color: var(--ink); text-decoration: none; }
  .wm svg { height: 21px; width: auto; display: block; }
  .tabs { display: flex; gap: 34px; }
  .tabs a { font-family: var(--mono); font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--quiet); text-decoration: none; padding: 20px 0 18px; border-bottom: 1.5px solid transparent; }
  .tabs a:hover { color: var(--ink); }
  .tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
  .who { justify-self: end; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--quiet); min-width: 0; }
  .who .site { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--sand); display: grid; place-items: center; font-size: 14px; color: var(--ink); flex: none; }
  .subtabs { max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; gap: 28px; }
  .subtabs button { background: none; border: 0; padding: 14px 0 12px; cursor: pointer; font-size: 16px; color: var(--quiet); border-bottom: 1.5px solid transparent; }
  .subtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .subbar { border-bottom: 1px solid var(--hairline); }

  /* ---------- page ---------- */
  .page { max-width: 1240px; margin: 0 auto; padding: 56px 24px 96px; }
  .page.enter { animation: rise .5s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  h1, .display { font-weight: 300; font-size: clamp(44px, 6.4vw, 84px); line-height: 1.02; letter-spacing: -.02em; margin: 0; text-wrap: balance; color: var(--ink); }
  h2 { font-weight: 300; font-size: clamp(34px, 4vw, 52px); line-height: 1.06; letter-spacing: -.015em; margin: 0; text-wrap: balance; color: var(--ink); }
  h3 { font-weight: 400; font-size: 22px; line-height: 1.25; margin: 0; color: var(--ink); }
  .lede { font-size: 21px; line-height: 1.45; color: var(--quiet); max-width: 40ch; margin: 18px 0 0; text-wrap: pretty; }
  .accent { color: var(--stamp); }
  .note { font-size: 14px; color: var(--faint); font-style: italic; }

  .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--ink); border-radius: 999px; padding: 8px 18px; background: transparent; cursor: pointer; font-size: 15px; color: var(--ink); white-space: nowrap; text-decoration: none; transition: background .15s, color .15s; }
  .pill:hover { background: var(--sand); }
  .pill.solid { background: var(--ink); color: var(--paper); }
  .pill.solid:hover { background: #2a2925; }
  .pill.quiet { border-color: var(--hairline); color: var(--quiet); }
  .link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 4px; }
  .link:hover { text-decoration-color: var(--ink); }

  /* ---------- Ask: home ---------- */
  .ask-home { min-height: calc(100vh - 61px - 160px); display: grid; align-content: center; justify-items: center; text-align: center; }
  .ask-home .label { margin-bottom: 26px; }
  .search { width: min(760px, 100%); margin-top: 40px; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 24px; border: 1px solid var(--ink); border-radius: 999px; background: #F8F6F1; box-shadow: 0 1px 0 var(--hairline); }
  .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 20px; padding: 10px 0; }
  .search input::placeholder { color: var(--faint); }
  .search .go { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--ink); color: var(--paper); cursor: pointer; display: grid; place-items: center; flex: none; }
  .search .go svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .suggest { margin-top: 30px; display: grid; gap: 4px; width: min(760px, 100%); text-align: left; }
  .suggest button { display: flex; justify-content: space-between; gap: 16px; background: none; border: 0; border-top: 1px solid var(--hairline); padding: 14px 4px; cursor: pointer; font-size: 18px; color: var(--quiet); text-align: left; }
  .suggest button:last-child { border-bottom: 1px solid var(--hairline); }
  .suggest button:hover { color: var(--ink); }
  .suggest button span:last-child { font-family: var(--mono); font-size: 13px; }
  .status-line { margin-top: 44px; }
  .status-line .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--stamp); margin-right: 8px; vertical-align: 1px; }

  /* ---------- Ask: answer ---------- */
  .ask-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 44px; }
  .ask-bar .search { margin: 0; width: 100%; }
  .ask-bar .search input { font-size: 18px; }
  .answer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 56px; align-items: start; }
  .answer .q { font-size: 15px; color: var(--quiet); margin-bottom: 14px; }
  .answer .verdict { font-weight: 300; font-size: clamp(34px, 3.6vw, 48px); line-height: 1.08; letter-spacing: -.015em; color: var(--ink); margin: 0 0 22px; text-wrap: balance; }
  .answer .body { font-size: 19px; line-height: 1.6; color: var(--type); max-width: 38em; }
  .answer .body p { margin: 0 0 1em; }
  .cite { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; margin: 0 2px; border-radius: 999px; border: 1px solid var(--ink); font-family: var(--mono); font-size: 11px; cursor: pointer; background: transparent; vertical-align: 3px; line-height: 1; }
  .cite:hover, .cite.on { background: var(--ink); color: var(--paper); }
  .meta-row { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 18px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--quiet); border: 1px solid var(--hairline); border-radius: 999px; padding: 4px 11px; white-space: nowrap; }
  .chip.ink { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .chip.ai { border-style: dashed; }
  .chip.ok::before, .chip.open::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .chip.open::before { background: var(--stamp); }

  /* footage frame (stock footage, labelled) */
  .clip { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; background: var(--ink); cursor: pointer; border: 0; padding: 0; }
  .clip img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease); }
  .clip:hover img { transform: scale(1.015); }
  .clip .rec { position: absolute; top: 10px; left: 10px; background: rgba(18,18,16,.78); color: var(--on-ink); font-family: var(--mono); font-size: 11px; letter-spacing: .08em; padding: 5px 9px; border-radius: 3px; display: inline-flex; align-items: center; gap: 7px; }
  .clip .rec::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--stamp); }
  .clip .cap { position: absolute; left: 10px; bottom: 10px; right: 10px; color: var(--on-ink); font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,.6); text-align: left; }
  .stock { margin-top: 8px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .moments { margin-top: 56px; border-top: 1px solid var(--hairline); padding-top: 22px; }
  .moments-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-top: 16px; }
  .moment { display: grid; gap: 10px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; }
  .moment .t { font-family: var(--mono); font-size: 12px; color: var(--ink); }
  .moment .d { font-size: 15px; line-height: 1.4; color: var(--quiet); }
  .moment.on .d { color: var(--ink); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }


  /* honesty line: what is confirmed, what is not, where the record is silent */
  .honest { display: flex; flex-wrap: wrap; gap: 4px 0; margin: -6px 0 22px; font-family: var(--mono); font-size: 12px; letter-spacing: .04em; color: var(--quiet); }
  .honest { gap: 4px 0; } .honest span:not(:last-child)::after { content: "·"; margin: 0 9px; color: var(--faint); }
  .honest .warn { color: var(--ink); }
  .cite.w { border-style: dashed; }

  /* the pull: every hat across the incident window */
  .pull { margin-top: 64px; border-top: 1px solid var(--ink); padding-top: 18px; }
  .pull-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; align-items: baseline; }
  .legend { display: flex; gap: 18px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--quiet); }
  .legend i { display: inline-block; width: 14px; height: 8px; margin-right: 7px; vertical-align: 0; }
  .legend i.zone, .p-seg.zone { background: var(--ink); }
  .legend i.other, .p-seg.other { background: var(--sand); }
  .legend i.gap, .p-seg.gap, .p-seg.off { background: repeating-linear-gradient(135deg, transparent 0 3px, var(--faint) 3px 4px); }
  .p-grid { margin-top: 18px; }
  .p-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) 210px; gap: 20px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
  .p-head { padding: 0 0 6px; border-bottom: 0; }
  .p-hat { font-family: var(--mono); font-size: 13px; color: var(--ink); }
  .p-trade { color: var(--quiet); }
  .p-track { position: relative; height: 18px; }
  .p-track.bare { height: 44px; }
  .p-seg { position: absolute; top: 4px; height: 10px; }
  .p-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--paper); background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: 10px; cursor: pointer; padding: 0; display: grid; place-items: center; }
  .p-note { font-family: var(--mono); font-size: 11.5px; color: var(--quiet); }
  .p-axis span { position: absolute; bottom: 0; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .p-axis span:first-child { transform: none; } .p-axis span:last-child { transform: translateX(-100%); }
  .p-band { position: absolute; top: 0; height: 22px; border-top: 2px solid var(--stamp); }
  .p-band span { position: absolute; top: 4px; left: 0; white-space: nowrap; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; color: var(--stamp); }
  .p-others { margin: 14px 0 0; font-size: 15px; color: var(--quiet); }

  /* before / after wipe */
  .wipe { position: relative; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; background: var(--ink); user-select: none; touch-action: none; }
  .wipe img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .wipe .after { clip-path: inset(0 0 0 var(--x, 50%)); filter: grayscale(1) contrast(.75) brightness(1.25) sepia(.15); }
  .wipe .bar { position: absolute; top: 0; bottom: 0; left: var(--x, 50%); width: 2px; background: var(--paper); transform: translateX(-1px); }
  .wipe .handle { position: absolute; top: 50%; left: var(--x, 50%); transform: translate(-50%, -50%); width: 40px; height: 40px; border-radius: 50%; background: var(--paper); border: 1px solid var(--ink); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; cursor: ew-resize; }
  .wipe .tag { position: absolute; bottom: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--on-ink); background: rgba(18,18,16,.78); padding: 5px 9px; border-radius: 3px; }


  /* ---------- lists (Record, Claims) ---------- */
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 32px; margin-bottom: 40px; }
  .head .lede { margin-top: 12px; }
  .group-h { margin: 48px 0 12px; }
  .rows { border-top: 1px solid var(--ink); }
  .r { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; gap: 24px; align-items: baseline; padding: 20px 0; border-bottom: 1px solid var(--hairline); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; cursor: pointer; color: inherit; }
  .r:hover .r-title { text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 4px; }
  .r-title { font-size: 21px; color: var(--ink); line-height: 1.3; }
  .r-sub { font-size: 15px; color: var(--quiet); margin-top: 4px; }
  .r-right { text-align: right; display: grid; gap: 6px; justify-items: end; }

  .two { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 48px; align-items: start; }
  .evidence { margin-top: 28px; padding: 22px 24px; background: var(--ink); color: var(--on-ink); border-radius: 4px; display: grid; gap: 10px; }
  .evidence .big { font-size: 20px; line-height: 1.35; color: var(--on-ink); }
  .evidence .sm { font-size: 15px; color: var(--quiet-dark); line-height: 1.5; }
  .evidence details summary { cursor: pointer; font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--quiet-dark); }
  .evidence code { display: block; margin-top: 10px; font-family: var(--mono); font-size: 12px; color: var(--on-ink); overflow-wrap: anywhere; }
  .back { margin-bottom: 28px; }


  .pkg { margin-top: 40px; padding: 32px; background: var(--ink); color: var(--on-ink); border-radius: 4px; }
  .pkg h3 { color: var(--on-ink); font-weight: 300; font-size: 30px; }
  .pkg .files { margin-top: 20px; display: grid; gap: 8px; font-family: var(--mono); font-size: 12.5px; color: var(--quiet-dark); }
  .pkg .files b { color: var(--on-ink); font-weight: 400; display: inline-block; min-width: 190px; }
  .checks { margin-top: 24px; display: grid; gap: 8px; }
  .check { font-family: var(--mono); font-size: 12.5px; color: var(--quiet-dark); display: flex; gap: 12px; }
  .check b { width: 44px; font-weight: 500; color: var(--quiet-dark); }
  .check.pass b { color: #9DC08F; }
  .stamp { display: inline-flex; align-items: center; gap: 10px; margin-top: 24px; padding: 8px 14px; border: 1.5px solid var(--stamp); color: var(--stamp); font-family: var(--mono); font-size: 13px; letter-spacing: .12em; border-radius: 3px; animation: stamp .55s var(--ease) both; }
  @keyframes stamp { 0% { opacity: 0; transform: scale(1.4) rotate(-4deg); } 60% { opacity: 1; transform: scale(.97); } 100% { transform: none; } }


  /* claim: hold, export, share */
  .claim-steps { margin-top: 56px; border-top: 1px solid var(--ink); }
  .step { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 20px; align-items: start; padding: 24px 0; border-bottom: 1px solid var(--hairline); }
  .step-n { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--ink); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; }
  .step.done .step-n { background: var(--ink); color: var(--paper); }
  .step h3 { font-weight: 300; font-size: 28px; line-height: 1.15; }
  .step p { margin: 8px 0 0; color: var(--quiet); max-width: 60ch; font-size: 16px; }
  .step p.fine { font-size: 14px; color: var(--faint); }
  .step-a { align-self: center; }
  .pkg-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: flex-start; }
  .pkg-p { color: var(--quiet-dark); font-size: 16px; margin: 12px 0 0; max-width: 60ch; }
  .pill.ghost { border-color: var(--quiet-dark); color: var(--on-ink); }
  .pill.ghost:hover { background: #2a2925; }
  .cmd { display: block; margin-top: 22px; font-family: var(--mono); font-size: 12.5px; color: var(--on-ink); overflow-wrap: anywhere; }
  .term-out { margin-top: 14px; display: grid; gap: 7px; min-height: 40px; }
  .check.skip b, .check.warn b { color: #D9B26A; }
  .check.fail b { color: var(--stamp); }
  .check { animation: fade .2s both; }
  .result { margin-top: 12px; font-family: var(--mono); font-size: 13px; letter-spacing: .04em; color: #9DC08F; }
  .result.fail { color: var(--stamp); }
  .scope { margin: 10px 0 0; font-size: 14px; color: var(--quiet-dark); max-width: 70ch; }


  .trail { display: inline-flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; color: var(--faint); }
  .trail span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .trail i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--faint); }
  .trail .on { color: var(--ink); } .trail .on i { background: var(--ink); border-color: var(--ink); }
  .pill:disabled { opacity: .45; cursor: not-allowed; }
  .sheet { position: fixed; inset: 0; z-index: 70; background: rgba(18,18,16,.42); display: grid; place-items: center; padding: 24px; animation: fade .2s both; }
  .sheet-in { width: min(560px, 100%); background: var(--paper); border-radius: 6px; padding: 28px 28px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: calc(100vh - 48px); overflow: auto; }
  .sheet-h { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .sheet-h h3 { font-weight: 300; font-size: 30px; }
  .sheet-b { display: grid; gap: 20px; margin-top: 20px; }
  .field { display: grid; gap: 8px; }
  .field p { margin: 0; font-size: 16px; color: var(--type); }
  .field p.fine { font-size: 14px; color: var(--quiet); }
  .field input, .field textarea { border: 0; border-bottom: 1px solid var(--ink); background: transparent; padding: 8px 0; font-size: 19px; outline: none; resize: none; }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg button { border: 1px solid var(--hairline); background: transparent; border-radius: 999px; padding: 7px 15px; cursor: pointer; font-size: 15px; color: var(--quiet); }
  .seg button[aria-checked="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }


  .ask-home .search { width: min(900px, 100%); min-height: 80px; padding: 10px 10px 10px 32px; }
  .ask-home .search input { font-size: 24px; }
  .ask-home .search .go { width: 58px; height: 58px; }
  .ask-home .suggest { width: min(900px, 100%); }
  .status-line { background: none; border: 0; cursor: pointer; padding: 6px 0; }
  .status-line:hover { color: var(--ink); }
  .attrib { margin-bottom: 14px; }
  .r.static { cursor: default; }
  .mono-r { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; color: var(--quiet); white-space: nowrap; }
  .cov { display: inline-flex; align-items: center; gap: 14px; }
  .cov-bar { width: 140px; height: 6px; background: var(--sand); border-radius: 999px; overflow: hidden; display: block; }
  .cov-bar i { display: block; height: 100%; background: var(--ink); }


  .mark-btn { margin-right: 8px; flex: none; background: transparent; border: 1px solid var(--ink); border-radius: 999px; padding: 6px 14px 6px 12px; cursor: pointer; font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; }
  .mark-btn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--stamp); }
  .mark-btn:hover { background: var(--sand); }

<script>
(function () {
  const D = OIDA.data;
  const $ = (s, r = document) => r.querySelector(s);
  const h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v; else if (k === 'html') el.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') Object.entries(v).forEach(([p, x]) => p.startsWith('--') ? el.style.setProperty(p, x) : (el.style[p] = x));
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? '' : v);
    }
    kids.flat(Infinity).forEach(c => c != null && c !== false && el.append(c.nodeType ? c : document.createTextNode(String(c))));
    return el;
  };
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const day = iso => { const [y, m, d] = iso.split('-').map(Number); return `${DOW[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]} ${d} ${MON[m - 1]}`; };
  const hhmm = x => { const m = Math.round(x * 60); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  const tc = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
  const hat = id => { const x = D.hatById[id]; return `${id} · ${x.trade}`; };
  const zone = id => (D.zoneById[id] || {}).name || id;
  const zoneFull = id => { const z = D.zoneById[id]; return z ? `${z.level === 'Site' || z.name.startsWith(z.level) ? '' : z.level + ' '}${z.name}` : id; };
  const toast = msg => { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = h('div', { class: 'toast', role: 'status' }, msg); document.body.append(t); setTimeout(() => t.remove(), 2600); };
  const arrow = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg>';
  $('#wm').innerHTML = OIDA.brand.wordmark;
  (function () {
    const btn = document.getElementById('proj'), menu = document.getElementById('proj-menu');
    btn.addEventListener('click', e => { e.stopPropagation(); menu.hidden = !menu.hidden; });
    document.getElementById('up-btn').addEventListener('click', e => { e.preventDefault(); go('record', { sub: 'upload', shift: null, mark: null }); });
    document.addEventListener('click', e => { if (!e.target.closest('.brandgrp')) menu.hidden = true; });
    menu.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; menu.hidden = true;
      if (b.dataset.p === 'earl') go('record', { sub: 'shifts', shift: 'earl' }); else go('ask', { q: null, sub: null }); });
  })();

  /* stock footage stands in for customer footage, and says so */
  const IMG = { stair: 'img/cv2.jpg', deck: 'img/cv1.jpg', ground: 'img/cv3.jpg', site: 'img/cv4.jpg', rebar: 'img/work.jpg', hat: 'img/worn.jpg' };
  const imgFor = e => {
    if (!e) return IMG.ground;
    if (e.zone && e.zone.includes('stair')) return [IMG.stair, IMG.deck][(e.t * 10 | 0) % 2];
    if (e.zone === 'site-crane' || e.zone === 'l1-dock' || e.zone === 'site-laydown') return IMG.site;
    if (e.zone === 'l3-edge' || e.zone === 'l4-openings') return IMG.rebar;
    if (e.zone === 'site-trench') return IMG.ground;
    return IMG.deck;
  };
  const clip = (e, opts = {}) => {
    const b = h('button', { class: 'clip', type: 'button', 'aria-label': 'Open clip ' + (e ? hhmm(e.t) : '') , onclick: () => viewer(e, opts) },
      h('img', { src: opts.img || imgFor(e), alt: '', loading: 'lazy' }),
      h('span', { class: 'rec' }, opts.real ? `REC ${tc(e.t)} · HASHED, NOT SEALED` : `REC ${e ? hhmm(e.t) + ':' + String((e.t * 997 | 0) % 60).padStart(2, '0') : ''} · SEALED`),
      opts.real ? h('span', { class: 'cap' }, 'Earl’s crew · CMU wall') : e ? h('span', { class: 'cap' }, `${hat(e.hat)} · ${zoneFull(e.zone)}`) : null);
    return b;
  };
  function viewer(e, opts = {}) {
    if (opts.real) return viewerReal(e);
    const v = h('div', { class: 'viewer', role: 'dialog', 'aria-modal': 'true' },
      h('div', { class: 'vt' }, h('span', { class: 'mono' }, e ? `${day(e.day)} · ${hhmm(e.t)} · ${hat(e.hat)}` : ''), h('button', { type: 'button', onclick: () => v.remove() }, 'CLOSE')),
      h('div', { class: 'vm' }, (() => { const c = clip(e); c.onclick = null; c.removeAttribute('aria-label'); c.tabIndex = -1; return c; })()),
      h('div', { class: 'vb' },
        h('div', null, h('div', { class: 'd' }, e ? e.what : ''), h('div', { class: 's' }, 'Unchanged since the hats docked and were sealed at 17:44. Time on the card before offload isn’t covered. Stock footage stands in for customer footage in this prototype.')),
        h('div', { class: 'meta-row' }, e && e.review === 'confirmed' ? h('span', { class: 'chip ink' }, 'Confirmed') : h('span', { class: 'chip ai' }, 'AI, unreviewed'))));
    document.body.append(v); v.querySelector('button').focus();
    const esc = ev => { if (ev.key === 'Escape') { v.remove(); document.removeEventListener('keydown', esc); } };
    document.addEventListener('keydown', esc);
  }

  /* the real pilot recording: hashed at ingest, never sealed, never shown as sealed */
  function viewerReal(e) {
    const v = h('div', { class: 'viewer', role: 'dialog', 'aria-modal': 'true' },
      h('div', { class: 'vt' }, h('span', { class: 'mono' }, `Fri 18 Sep · ${tc(e.t)} into the recording · Earl’s crew`), h('button', { type: 'button', onclick: () => v.remove() }, 'CLOSE')),
      h('div', { class: 'vm' }, h('div', { class: 'clip', style: { cursor: 'default' } }, h('img', { src: IMG.ground, alt: '' }), h('span', { class: 'rec' }, `REC ${tc(e.t)} · HASHED, NOT SEALED`), h('span', { class: 'cap' }, 'Earl’s crew · CMU wall'))),
      h('div', { class: 'vb' },
        h('div', null, h('div', { class: 'd' }, e.what), h('div', { class: 's' }, 'Pilot capture. Hashed when it reached our servers on 25 Sep, not at a dock, so the time on the card before upload is not covered. Illustration image; pilot footage is not shown in this prototype.')),
        h('div', { class: 'meta-row' }, h('span', { class: 'chip ai' }, 'AI, unreviewed'))));
    document.body.append(v); v.querySelector('button').focus();
    const esc = ev => { if (ev.key === 'Escape') { v.remove(); document.removeEventListener('keydown', esc); } };
    document.addEventListener('keydown', esc);
  }

  /* ---------------- ASK ---------------- */
  const AI_NAME = 'Lynx'; // the assistant's name; set only here
  const NOW = '09:14';
  const isPhone = () => matchMedia('(max-width: 760px)').matches;
  const kbd = k => h('span', { class: 'kbd', 'aria-hidden': 'true' }, k);
  const SUGGEST = {
    rail: 'Was the rail up at the north stair on Tuesday?',
    dock: 'What happened at the loading dock on Friday?',
    flashing: 'Show unit 304’s window wall before the drywall went up',
    crews: 'Who was on L3 Tuesday morning?'
  };
  const ANSWERS = {
    rail: {
      q: SUGGEST.rail,
      verdict: 'Not all day. The top rail was off the L3 landing from 10:35 to 11:15.',
      body: [
        ['At 10:35 the masonry crew lifted the top rail aside to stage block ', 'E-1302', '. At 10:42 the open side of the landing had a mid-rail and no top rail ', 'E-1303', '.'],
        ['The rail was clamped back at 11:15 ', 'E-1304', ' and checked by hand at 14:10 ', 'E-1305', '.']
      ],
      events: ['E-1302', 'E-1303', 'E-1304', 'E-1305'], lead: 'E-1303',
      pull: { day: '2026-10-13', t0: 10.5, t1: 11.5, zone: 'l3-stair', band: [10.58, 11.25, 'NO TOP RAIL'] },
      claim: 'CL-0043'
    },
    flashing: {
      q: SUGGEST.flashing,
      verdict: 'The flashing was in before the wall was closed.',
      body: [
        ['Self-adhered flashing went in at the unit 304 window on Thursday 8 Oct at 08:24, sill first, then jambs ', 'E-0801', '. The bathroom wall behind it was filmed open at 13:06 ', 'E-0802', '.'],
        ['Drywall went up over both walls on Monday 12 Oct at 10:03 ', 'E-1201', '.']
      ],
      events: ['E-0801', 'E-0802', 'E-1201'], lead: 'E-0801', wipe: true, claim: 'CL-0042'
    },
    dock: {
      q: SUGGEST.dock,
      verdict: 'Two window crates arrived damaged, before anyone unloaded them.',
      body: [
        ['The flatbed arrived at 07:21 with split corners on two crates ', 'E-0901', '. At 07:33 the hat filmed cracked glazing in crate 7, still strapped to the trailer ', 'E-0902', '.']
      ],
      events: ['E-0901', 'E-0902'], lead: 'E-0902',
      pull: { day: '2026-10-09', t0: 7.1, t1: 8.0, zone: 'l1-dock' },
      claim: 'CL-0044'
    },
    crews: {
      q: SUGGEST.crews,
      verdict: 'Three crews filmed on L3 before noon.',
      body: [['The Arden field engineer (H-22) walked the north stair at 09:03 ', 'E-1301', '. Keystone Masonry (H-03) worked the stair from 10:35 ', 'E-1302', '. Brightline Electric (H-07) ran the corridor and passed the stair at 10:42 ', 'E-1303', '.']],
      events: ['E-1301', 'E-1302', 'E-1303'], lead: 'E-1301', noClaim: true
    }
  };

  /* ---- what a question pins down: level, unit, crate, day, camera unit, time range ----
     The hand-routed engine below must never answer about a different place or time than the one asked. */
  const isoAdd = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
  const dowOf = iso => new Date(Date.parse(iso + 'T00:00:00Z')).getUTCDay();
  const WDAY = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
  function parseDays(s) {
    const out = [];
    if (/\btoday\b/.test(s)) out.push(D.today);
    if (/\byesterday\b/.test(s)) out.push(isoAdd(D.today, -1));
    const lastWeek = /\blast week\b/.test(s), thisMon = isoAdd(D.today, -((dowOf(D.today) + 6) % 7));
    (s.match(/\b(monday|mon|tuesday|tues|tue|wednesday|wed|thursday|thurs|thur|thu|friday|fri|saturday|sat|sunday|sun)\b/g) || []).forEach(w => {
      const want = WDAY[w.slice(0, 3)]; let d = isoAdd(D.today, -1);
      while (dowOf(d) !== want) d = isoAdd(d, -1); // most recent one before today
      if (lastWeek && d >= thisMon) d = isoAdd(d, -7);
      out.push(d);
    });
    const md = [...s.matchAll(/\b(?:oct(?:ober)?\.?\s*(\d{1,2})(?:st|nd|rd|th)?|(\d{1,2})(?:st|nd|rd|th)?\s*oct(?:ober)?|10\/(\d{1,2}))\b/g)];
    md.forEach(m => { const n = +(m[1] || m[2] || m[3]); if (n >= 1 && n <= 31) out.push(`2026-10-${String(n).padStart(2, '0')}`); });
    return [...new Set(out)];
  }
  function entitiesOf(q) {
    const s = q.toLowerCase();
    const levels = new Set();
    for (const m of s.matchAll(/\b(?:l|level|lvl|floor)\s*-?\s*([1-9])\b/g)) levels.add('L' + m[1]);
    for (const m of s.matchAll(/\b([1-9])(?:st|nd|rd|th)\s*(?:floor|level)\b/g)) levels.add('L' + m[1]);
    if (/\broof\b/.test(s)) levels.add('Roof');
    const units = [...s.matchAll(/\b(?:units?|apt|apartment)\s*#?\s*(\d{3})\b/g)].map(m => m[1]);
    const crates = [...s.matchAll(/\bcrates?\s*#?\s*(\d{1,3})\b/g)].map(m => m[1]);
    const cams = [...s.matchAll(/\bh\s?-?\s?(\d{2})\b/g)].map(m => 'H-' + m[1]);
    return { levels: [...levels], units: [...new Set(units)], crates: [...new Set(crates)], cams: [...new Set(cams)], days: parseDays(s) };
  }
  /* an answer's entities come from what it cites, never from a typed list */
  function entitiesOfAnswer(a) {
    const E = { levels: new Set(), units: new Set(), crates: new Set(), cams: new Set(), days: new Set() };
    a.events.map(id => D.eventById[id]).forEach(e => {
      E.levels.add(D.zoneById[e.zone].level); E.days.add(e.day); E.cams.add(e.hat);
      for (const m of e.what.toLowerCase().matchAll(/\bunits?\s*(\d{3})\b/g)) E.units.add(m[1]);
      for (const m of e.what.toLowerCase().matchAll(/\bcrates?\s*(\d{1,3})\b/g)) E.crates.add(m[1]);
    });
    if (a.pull) { E.levels.add(D.zoneById[a.pull.zone].level); E.days.add(a.pull.day); pullSummary(a).inz.forEach(r => E.cams.add(r.hat)); }
    return E;
  }
  const DIMS = [['levels', x => x === 'Roof' ? 'the roof' : x], ['units', x => 'unit ' + x], ['crates', x => 'crate ' + x], ['days', x => day(x)], ['cams', x => x]];
  function conflictsWith(qE, a) {
    const E = entitiesOfAnswer(a), out = [];
    DIMS.forEach(([k, fmt]) => qE[k].forEach(v => { if (!E[k].has(v)) out.push(fmt(v)); }));
    return out;
  }
  /* a typed window like "10:30-11:30" or "10:30 to 11:30" narrows the pull */
  function parseWindow(s) {
    const m = s.match(/\b(\d{1,2})[:.h]?(\d{2})\s*(?:-|–|—|to|until|and)\s*(\d{1,2})[:.h]?(\d{2})\b/);
    if (!m) return null;
    const a = +m[1] + m[2] / 60, b = +m[3] + m[4] / 60;
    return b > a && a >= 5 && b <= 20 ? [a, b] : null;
  }
  const PLACEWORDS = [['roof', 'roof-deck'], ['crane', 'site-crane'], ['trench', 'site-trench'], ['laydown', 'site-laydown'], ['dock', 'l1-dock'], ['lobby', 'l1-lobby'], ['retail', 'l1-retail'], ['corridor', 'l3-corridor'], ['opening', 'l4-openings'], ['edge', 'l3-edge']];
  function parseCtx(s, qE) {
    const days = qE.days, lvl = (qE.levels[0] || '').toLowerCase();
    let zone = null, words = [];
    const pw = PLACEWORDS.find(([w]) => s.includes(w));
    if (pw) { zone = pw[1]; words = [pw[0], pw[0] + 's']; }
    else if (/stair/.test(s)) { zone = (lvl && D.zoneById[lvl + '-stair']) ? lvl + '-stair' : null; words = ['stair', 'stairs']; }
    else if (/elevator|core/.test(s)) { zone = (lvl && D.zoneById[lvl + '-core']) ? lvl + '-core' : null; words = ['elevator', 'core']; }
    return { day: days[0] || null, zone, zoneWords: words };
  }

  /* routes a question. Some go to an answer, some straight to the view that answers them. */
  function route(q) {
    const s = q.toLowerCase();
    if (/\bslow|idle|lazy|productiv|fastest|\brank|\bbreaks?\b|who.*(late|worst)|on (his|her) phone/.test(s)) return { refuse: true, q };
    if (/\b(say|said|told|hear|heard|audio|conversation)\b/.test(s)) return { audio: true, q };
    if (/^\s*mark\b/.test(s)) return { go: () => markSheet() , q };
    if (/needs? me|what needs|to-?do|my queue|waiting on me|my list/.test(s)) return { needs: true, q };
    if (/captur|coverage|by crew|per crew|each crew|how much .*(film|record|camera)/.test(s)) return { go: () => go('record', { sub: 'coverage', week: /this week/.test(s) ? 'this' : 'last', shift: null, mark: null }), q };
    const qE = entitiesOf(s), win = parseWindow(s);
    const canned = /\brail|guardrail|guard rail|stair/.test(s) ? 'rail' : /flash|drywall|behind the wall|conceal|window wall/.test(s) || qE.units.length ? 'flashing'
      : /dock|deliver|crate|damaged on arrival/.test(s) ? 'dock' : /who was|l3 .*morning/.test(s) ? 'crews' : null;
    if (canned) {
      let a = ANSWERS[canned];
      if (win && a.pull) a = { ...a, pull: { ...a.pull, t0: win[0], t1: win[1] } };
      a = { ...a, q };
      const off = conflictsWith(qE, a);
      if (off.length) return { none: true, q, ctx: parseCtx(s, qE), asked: off, near: ANSWERS[canned] };
      return a;
    }
    const ctx = parseCtx(s, qE);
    const STOP = new Set(['what', 'was', 'were', 'there', 'the', 'show', 'when', 'where', 'did', 'does', 'have', 'with', 'from', 'that', 'this', 'happened', 'happen', 'anything', 'on', 'at', 'in', 'any', 'today', 'yesterday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'morning', 'afternoon', 'week', 'last', 'level', 'unit', 'units', 'crate']);
    const topic = s.split(/\W+/).filter(w => w.length > 3 && !STOP.has(w) && !(ctx.zoneWords || []).includes(w) && !/^\d+$/.test(w));
    const pool = D.events.filter(e => (!ctx.zone || e.zone === ctx.zone) && !conflictsWith(qE, { events: [e.id] }).length);
    const hits = (topic.length ? pool.filter(e => topic.some(w => (e.what + ' ' + e.type).toLowerCase().includes(w))) : (ctx.zone || qE.days.length ? pool : [])).slice(0, 4);
    if (!hits.length) return { none: true, q, ctx };
    return { q, verdict: `${hits.length} moment${hits.length > 1 ? 's' : ''} in the record match.`, body: [hits.flatMap((e, i) => [`${day(e.day)} ${hhmm(e.t)}: ${e.what} `, e.id, i < hits.length - 1 ? '. ' : '.'])], events: hits.map(e => e.id), lead: hits[0].id, noClaim: true };
  }
  function ask(q) {
    q = (q || '').trim(); if (!q) return;
    const r = route(q);
    if (r.go) return r.go();
    go('ask', { q, sub: 'answer' });
  }

  /* not in the record: say so plainly, point at the closest thing it does have, never substitute it */
  function notInRecord(a) {
    const { day: d, zone: z } = a.ctx || {};
    const box = h('div', { class: 'silent', style: { marginTop: '40px' } }, h('div', { class: 'label' }, 'What the record does have'));
    if (d === D.today) { box.append(h('p', null, 'Today’s footage is still on the camera units. It becomes searchable when they dock and seal, around 17:44.')); return box; }
    if (z && d) {
      const iv = mergeIv(D.shifts.filter(x => x.day === d).flatMap(x => x.spans.filter(sp => sp.zone === z).map(sp => [sp.start, sp.end])));
      box.append(h('p', null, iv.length ? `${zoneFull(z)} was on camera on ${day(d)}: ${iv.map(([p, q]) => `${hhmm(p)}–${hhmm(q)}`).join(', ')}. Nothing in that footage matches the question.` : `No camera unit filmed ${zoneFull(z)} on ${day(d)}. The record is silent there.`));
    }
    const near = D.events.filter(e => (z && e.zone === z) || (!z && d && e.day === d)).slice(0, 3);
    if (near.length) box.append(h('div', { class: 'rows', style: { marginTop: '16px' } }, near.map(e => row(`${day(e.day)} ${hhmm(e.t)}`, e.what, `${zoneFull(e.zone)} · nearby moment, not an answer`, h('span', { class: 'mono-r' }, e.review === 'confirmed' ? 'Confirmed' : 'AI, unreviewed'), () => viewer(e)))));
    if (box.children.length === 1) box.append(h('p', null, 'Try a place, a day or a time, like “north stair Tuesday 10:40”.'));
    return box;
  }
  const mergeIv = iv => { const m = []; iv.slice().sort((x, y) => x[0] - y[0]).forEach(([a, b]) => { const l = m[m.length - 1]; if (l && a <= l[1] + 0.01) l[1] = Math.max(l[1], b); else m.push([a, b]); }); return m; };
  const placeOf = a => { const z = a.pull ? a.pull.zone : D.eventById[a.lead].zone; const ds = [...new Set(a.events.map(id => D.eventById[id].day))]; return `${zoneFull(z)}, ${ds.map(x => day(x)).join(' and ')}`; };

  /* home composer: a workspace panel (room to type, toolbar below), like the LLM apps. No microphone: Oida records no audio. */
  function composer() {
    let mode = 'ask'; const scopes = ['This week', 'Today', 'Yesterday', 'All footage']; let sc = 0;
    const input = h('textarea', { id: 'ask-home', rows: '2', placeholder: `Ask ${AI_NAME}`, 'aria-label': `Ask ${AI_NAME}`, autocomplete: 'off' });
    const send = h('button', { class: 'send', type: 'submit', 'aria-label': 'Ask', disabled: true, html: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"/></svg>' });
    const submit = () => { const q = input.value.trim(); if (!q) return; const scoped = mode === 'pull' && !/\d/.test(q) ? q + ' ' + scopes[sc].toLowerCase() : q; ask(scoped); };
    input.addEventListener('input', () => { send.disabled = !input.value.trim(); input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; });
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
    const menu = h('div', { class: 'plus-menu', hidden: true },
      h('button', { type: 'button', onclick: () => { menu.hidden = true; go('record', { sub: 'upload', shift: null, mark: null }); } }, h('b', null, 'Upload footage'), h('span', null, 'Send a camera card to Oida')),
      h('button', { type: 'button', onclick: () => { menu.hidden = true; document.getElementById('mark-btn')?.click(); } }, h('b', null, 'Mark this moment'), h('span', null, 'Flag now; footage attaches at the dock')),
      h('button', { type: 'button', onclick: () => { menu.hidden = true; go('claims', { sub: 'files' }); } }, h('b', null, 'Open a claim file'), h('span', null, 'Hold, export and share')));
    const plus = h('button', { class: 'plus', type: 'button', 'aria-label': 'Upload, mark or open a claim', 'aria-haspopup': 'menu', onclick: e => { e.preventDefault(); menu.hidden = !menu.hidden; },
      html: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>' });
    const seg = h('div', { class: 'seg', role: 'tablist', 'aria-label': 'Mode' });
    const segBtn = (k, label, hint) => h('button', { type: 'button', role: 'tab', 'aria-selected': String(k === mode), onclick: () => { mode = k; [...seg.children].forEach(b => b.setAttribute('aria-selected', String(b.dataset.k === k))); input.placeholder = hint; input.focus(); }, 'data-k': k }, label);
    seg.append(segBtn('ask', 'Ask', `Ask ${AI_NAME}`), segBtn('pull', 'Pull a window', 'A place and a time, e.g. north stair Tuesday 10:30–11:30'));
    const scope = h('button', { class: 'scope', type: 'button', title: 'Time range', onclick: e => { e.preventDefault(); sc = (sc + 1) % scopes.length; scope.firstChild.textContent = scopes[sc]; } }, h('span', null, scopes[0]), h('span', { html: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8l4 4 4-4"/></svg>' }));
    document.addEventListener('click', e => { if (!e.target.closest('.composer')) menu.hidden = true; });

      input, h('div', { class: 'ctools' }, plus, seg, h('span', { class: 'cspacer' }), scope, send), menu);
  }

  function searchBox(value, big) {
    const input = h('input', { id: big ? 'ask-home' : 'ask-top', type: 'search', value: value || '', placeholder: big ? `Ask ${AI_NAME}…` : `Ask ${AI_NAME} anything about the job…`, 'aria-label': `Ask ${AI_NAME}`, autocomplete: 'off' });
    return h('form', { class: 'search', role: 'search', onsubmit: ev => { ev.preventDefault(); ask(input.value); } },
      input, h('button', { class: 'go', type: 'submit', 'aria-label': 'Ask', html: arrow }));
  }

  /* what needs you today: open safety, things to review, holds not exported, access about to end, marks waiting */
  function needs() {
    const out = [];
    D.hazards.filter(x => x.status === 'open').forEach(x => out.push({ k: 'Open safety item', st: true, t: `${x.title} · ${zoneFull(x.zone)}`, r: `open ${daysBetween(x.found.slice(0, 10), D.today)} d`, go: () => go('record', { sub: 'safety', shift: null, mark: null }) }));
    D.hazards.filter(x => x.status === 'review').forEach(x => out.push({ k: 'To review · AI, unreviewed', t: `${x.title} · ${zoneFull(x.zone)}`, r: day(x.found.slice(0, 10)).slice(4), go: () => go('record', { sub: 'safety', shift: null, mark: null }) }));
    D.claims.filter(c => c.hold && !c.export).forEach(c => out.push({ k: 'Held, not exported', t: `${c.id} · ${c.title}`, r: 'export', go: () => go('claims', { sub: 'files', claim: c.id, exporting: false }) }));
    D.grants.forEach(g => { if (!g.active) return; const left = daysBetween(D.today, g.until); if (left <= 14) out.push({ k: 'Access ends soon', t: `${g.to.split(' · ')[0]} · ${g.claim} · ends ${day(g.until)}`, r: `${left} d left`, go: () => go('claims', { sub: 'access', claim: null }) }); });
    D.marks.filter(m => m.status === 'waiting').forEach(m => out.push({ k: 'Mark waiting for the dock', t: m.text, r: 'tonight', go: () => go('record', { sub: 'marks', mark: null, shift: null }) }));
    return out;
  }
  const needsSummary = N => {
    const c = k => N.filter(n => n.k.startsWith(k)).length, bits = [];
    if (c('Open safety')) bits.push(`${c('Open safety')} open safety item${c('Open safety') > 1 ? 's' : ''}`);
    if (c('To review')) bits.push(`${c('To review')} to review`);
    N.filter(n => n.k === 'Held, not exported').forEach(n => bits.push(`${n.t.split(' · ')[0]} not exported`));
    N.filter(n => n.k === 'Access ends soon').forEach(n => bits.push(`${n.t.split(' · ')[0].split(' ')[0]} access ends in ${n.r.replace(' left', '')}`));
    if (c('Mark waiting')) bits.push(`${c('Mark waiting')} mark${c('Mark waiting') > 1 ? 's' : ''} waiting`);

  };

  function askHome(page) {
    page.append(h('section', { class: 'ask-home zen' },
      h('h1', null, `${AI_NAME} is here.`),
      zenBar(),

    setTimeout(() => !isPhone() && $('#ask-home')?.focus({ preventScroll: true }), 50);
  }

  /* one quiet line under the bar: what Lynx can see right now */
  function heartbeat() {
    const last = D.days[D.days.length - 1], ss = D.shifts.filter(x => x.day === last);
    const hrs = ss.reduce((a, x) => a + x.spans.reduce((b, sp) => b + sp.end - sp.start, 0), 0);
    return h('button', { class: 'beat', type: 'button', title: 'See the shifts', onclick: () => go('record', { sub: 'shifts', shift: null, mark: null }) },
      h('span', { class: 'beat-dot', 'aria-hidden': 'true' }),
      `Sealed ${day(last)} at 17:44 · ${ss.length} hats · ${hrs.toFixed(1)} hours on the record`);
  }

  /* one clean search bar: + (upload, mark, claim) · the question · send */
  function zenBar() {
    const input = h('input', { id: 'ask-home', type: 'text', placeholder: 'What do you want to know?', 'aria-label': `Ask ${AI_NAME}`, autocomplete: 'off' });
    const send = h('button', { class: 'send', type: 'submit', 'aria-label': 'Ask', html: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"/></svg>' });
    const menu = h('div', { class: 'plus-menu', hidden: true },
      h('button', { type: 'button', onclick: () => { menu.hidden = true; go('record', { sub: 'upload', shift: null, mark: null }); } }, 'Upload footage'),
      h('button', { type: 'button', onclick: () => { menu.hidden = true; document.getElementById('mark-btn')?.click(); } }, 'Mark this moment'),

    const plus = h('button', { class: 'plus', type: 'button', 'aria-label': 'More', 'aria-haspopup': 'menu', onclick: e => { e.preventDefault(); menu.hidden = !menu.hidden; }, html: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>' });
    document.addEventListener('click', e => { if (!e.target.closest('.zenbar')) menu.hidden = true; });

  /* the empty box hints at what to ask, one example at a time; stops when the user types or prefers less motion */
  function rotatePlaceholder(input) {
    if (!input) return;
    const ex = ['Was the rail up at the north stair on Tuesday?', 'What arrived damaged at the dock on Friday?', 'Show unit 304’s window wall before the drywall', 'What needs me today?'];
    let i = 0; input.placeholder = `Ask ${AI_NAME}  ·  ${ex[0]}`;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const t = setInterval(() => { if (!document.body.contains(input)) return clearInterval(t); if (input.value) return; i = (i + 1) % ex.length; input.placeholder = `Ask ${AI_NAME}  ·  ${ex[i]}`; }, 3800);
  }

  function needsAnswer(page, st) {
    const N = needs();
    page.append(h('div', { style: { maxWidth: '980px' } },
      h('div', { class: 'label attrib' }, `${AI_NAME} · from claims, safety, access and marks`),
      h('p', { class: 'verdict display', style: { fontSize: 'clamp(34px,4vw,52px)', margin: '0 0 18px' } }, N.length ? `${N.length} thing${N.length > 1 ? 's' : ''} need${N.length > 1 ? '' : 's'} you today.` : 'Nothing needs you today.'),
      h('div', { class: 'honest' }, needsSummary(N).map(t => h('span', null, t))),
      h('div', { class: 'rows' }, N.map(n => row(n.k, n.t, null, h('span', { class: 'mono-r' + (n.st ? ' accent' : '') }, n.r), n.go)))));
  }

  let currentAnswer = null;
  function citeText(parts, onCite) {
    return parts.map(p => D.eventById[p] ? (() => { const i = currentAnswer.events.indexOf(p) + 1; return h('button', { class: 'cite', type: 'button', 'data-ev': p, title: 'Show this moment', onclick: () => onCite(p) }, i || '•'); })() : p);
  }

  /* coverage: how much of the work is on the record, by day and by place, computed from the sealed spans.

  const MIN_CREW_CAMERAS = 3;
  function weekDays(which) {
    const thisMon = isoAdd(D.today, -((dowOf(D.today) + 6) % 7));
    if (which === 'this') return D.days.filter(d => d >= thisMon && d < D.today);
    const lastMon = isoAdd(thisMon, -7), lastFri = isoAdd(lastMon, 4);
    return D.days.filter(d => d >= lastMon && d <= lastFri); // the previous Monday to Friday
  }
  function recordCoverage(page, st) {
    const wk = st.week === 'this' ? 'this' : 'last', days = weekDays(wk);
    const shifts = D.shifts.filter(s => days.includes(s.day));
    const cap = shifts.reduce((a, s) => a + hrsOf(s), 0), worked = D.coverage.reduce((a, c) => a + c.worked[wk], 0);
    page.append(pageHead(`Record · coverage · ${wk === 'last' ? 'last week' : 'this week so far'} · ${day(days[0])} to ${day(days[days.length - 1])}`, `${(cap / worked * 100).toFixed(0)}% of the work, on the record.`,
      `${cap.toFixed(1)} of ${worked} crew-hours were filmed and sealed, across the whole site. Send it to the broker before they ask; check the silences before an adjuster does.`, ['Download for the broker', () => toast('Coverage report PDF: by day and by place, for the whole site')]));

      h('button', { type: 'button', role: 'radio', 'aria-checked': String(wk === k), onclick: () => { st.week = k; render(); } }, l))));
    /* by day: hours of footage, all units combined, drawn to scale */
    const byDay = days.map(d => ({ d, hrs: shifts.filter(s => s.day === d).reduce((a, s) => a + hrsOf(s), 0), iv: siteSpans(d) }));
    const maxDay = Math.max(...byDay.map(x => x.hrs));
    page.append(h('div', { class: 'cov-h' }, h('span', { class: 'label' }, 'By day · hours of footage, whole site'), h('span', { class: 'label' }, `${cap.toFixed(1)} h in ${days.length} days`)), tbl([
      ['Day', '120px', 'txt', x => h('span', { class: 'tc' }, day(x.d)), false, '64px'],
      ['Hours of footage, to scale', 'minmax(0, 1fr)', 'viz', x => h('span', { class: 'hbar' }, h('i', { style: { width: (x.hrs / maxDay * 100).toFixed(1) + '%' } })), false, 'minmax(0, 1fr)'],
      ['First → last footage', '130px', 'num', x => `${hhmm(x.iv[0][0])}–${hhmm(x.iv[x.iv.length - 1][1])}`, true],
      ['Hours', '80px', 'num', x => x.hrs.toFixed(1), false, '48px']
    ], byDay, x => go('record', { sub: 'shifts', shift: x.d, mark: null })));
    /* by place: share of the working day (07:00–15:30) each place had any camera on it */
    const W0 = 7, W1 = 15.5, span = (W1 - W0) * days.length;
    const byZone = D.zones.map(z => {
      const filmed = days.reduce((a, d) => a + siteSpans(d, z.id).reduce((t, [p, q]) => t + Math.max(0, Math.min(W1, q) - Math.max(W0, p)), 0), 0);
      const hrs = shifts.reduce((a, s) => a + s.spans.filter(sp => sp.zone === z.id).reduce((b, sp) => b + sp.end - sp.start, 0), 0);
      return { z, filmed, hrs, n: days.filter(d => siteSpans(d, z.id).length).length };
    }).filter(x => x.hrs > 0).sort((a, b) => b.filmed - a.filmed);
    page.append(h('div', { class: 'cov-h' }, h('span', { class: 'label' }, 'By place · share of the working day, 07:00–15:30, with any camera on it'), h('span', { class: 'label' }, `${byZone.length} places filmed`)), tbl([
      ['Place', '220px', 'txt', x => h('span', { class: 'tb-title' }, zoneFull(x.z.id)), false, '104px'],
      ['On camera, to scale', 'minmax(0, 1fr)', 'viz', x => h('span', { class: 'hbar' }, h('i', { style: { width: (x.filmed / span * 100).toFixed(1) + '%' } })), false, 'minmax(0, 1fr)'],
      ['Days', '64px', 'num', x => `${x.n}/${days.length}`, true],
      ['Hours', '80px', 'num', x => x.hrs.toFixed(1), true],
      ['On camera', '90px', 'num', x => `${(x.filmed / span * 100).toFixed(0)}%`, false, '48px']

  }

  function sheet(title, body, onOk, okLabel) {

    const seg = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Access ends' }, [7, 14, 30].map(d => h('button', { type: 'button', role: 'radio', 'aria-checked': String(d === days), onclick: ev => { days = d; seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(b === ev.currentTarget))); } }, `${d} days`)));
    sheet('Share with the adjuster', h('div', { class: 'sheet-b' },
      h('label', { class: 'field' }, h('span', { class: 'label' }, 'Adjuster’s email'), h('input', { type: 'email', required: true, placeholder: 'name@carrier.com', autocomplete: 'off' })),
      h('div', { class: 'field' }, h('span', { class: 'label' }, 'Access ends after'), seg),
      h('div', { class: 'field' }, h('span', { class: 'label' }, 'What they get'),
        h('p', null, `${c.export} only: ${c.moments.length} clips, where each came from in the sealed shifts, the custody log and the verifier. Not the rest of the footage, and no other claim.`),
        h('p', { class: 'fine' }, 'We email the package hash to them separately, so they can check the package wasn’t rebuilt.'))),
      s => { const email = s.querySelector('input').value; const until = isoAdd(D.today, days);
        D.grants.unshift({ claim: c.id, to: email, email, until, active: true, last: 'not opened yet' });
        D.custody.unshift({ at: `${D.today}T${NOW}`, who: 'Site superintendent', what: `Shared package v${c.version || 1} with ${email}, until ${until}`, target: c.export });
        toast(`Shared with ${email} until ${day(until)}. Logged.`); render(); }, 'Share');
  }

  /* every package version gets its own manifest hash; known sample ones are fixed, new ones derived from id + version */
  function pkgHash(id, v) {
    const known = { 'OIDA-EXP-2026-0117|1': '425bcceeb282570a', 'OIDA-EXP-2026-0104|1': '9d1e07b3c4a8f215' };
    if (known[id + '|' + v]) return known[id + '|' + v];
    let a = 0x811c9dc5, b = 0x01000193; const s = id + '#v' + v;
    for (let i = 0; i < s.length; i++) { a = Math.imul(a ^ s.charCodeAt(i), 16777619) >>> 0; b = Math.imul(b ^ s.charCodeAt(s.length - 1 - i), 2246822519) >>> 0; }
    return (a.toString(16).padStart(8, '0') + b.toString(16).padStart(8, '0')).slice(0, 16);
  }
  /* mirrors the output of sealing/oida_seal/verify.py, including what it can't check yet */
  function verifyRun(box, c, shifts, tampered, opts = {}) {
    const id = c.export, v = c.version || 1, hash = pkgHash(id, v);
    const n = c.moments.length, conf = c.moments.filter(m => D.eventById[m].review === 'confirmed').length;
    const lines = [
      tampered ? ['FAIL', `files: clips/exhibit-2.mp4 SHA-256 does not match manifest.json`] : ['PASS', `files: ${n + 6} listed files present, SHA-256 and sizes match, no extra files`],
      ...shifts.map(s => ['PASS', `shift ${s} merkle root: recomputed from the manifest and its 8 MiB blocks`]),
      ['SKIP', 'signatures: dock signs with an HMAC stand-in; only the key holder can check it'],
      ['PASS', `chain: ${[...new Set(shifts.map(s => 'H-' + s.slice(-2)))].join(', ')} chains intact back to the previous shift`],
      tampered ? ['FAIL', 'clip exhibit-2.mp4 inclusion: does not hash up to shift root'] : ['PASS', `clips: ${n} clips hash up to their sealed shift roots`],
      ['PASS', 'custody: every row chained from genesis; export row records this package'],
      ['WARN', 'timestamps: no RFC 3161 tokens yet; time of existence rests on the custody log'],
      ['PASS', `events: ${n} annotations point to sealed originals; ${conf} reviewer-confirmed, ${n - conf} machine-suggested`],
      ['PASS', `anchor: package hash matches the value Oida sent separately`]
    ];
    box.innerHTML = '';
    const out = h('div', { class: 'term-out' });
    const pkg = h('div', { class: 'pkg', id: 'pkg-run' },
      h('div', { class: 'pkg-h' }, h('div', null, h('div', { class: 'label', style: { color: 'var(--quiet-dark)' } }, `${id} · v${v} · frozen`), h('h3', { style: { marginTop: '10px' } }, opts.title || 'Anyone can check this package.')),
        h('button', { class: 'pill ghost', type: 'button', onclick: () => verifyRun(box, c, shifts, !tampered, { ...opts, noScroll: true, onDone: null }) }, tampered ? 'Restore the original' : 'Try it: change one byte')),
      h('p', { class: 'pkg-p' }, opts.line || 'The adjuster runs one script on their own machine, offline. Oida sends the package hash separately, so a rebuilt package can’t pass.'),
      h('code', { class: 'cmd' }, `$ python3 verify.py ${id} --expect-manifest ${hash}…`), out);
    box.append(pkg);
    if (!opts.noScroll) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const gap = opts.fast ? 60 : 160;
    lines.forEach(([k, t], i) => setTimeout(() => out.append(h('div', { class: 'check ' + k.toLowerCase() }, h('b', null, k), h('span', null, t))), gap * (i + 1)));
    setTimeout(() => {
      out.append(h('div', { class: 'result ' + (tampered ? 'fail' : 'pass') }, tampered ? 'RESULT  FAIL · exhibit-2.mp4 was changed after export.' : 'RESULT  PASS · no alteration detected inside the package.'),
        h('p', { class: 'scope' }, 'Scope: integrity is checkable from offload at the dock onward. The time the card spent in the camera before offload is not covered. It shows the files are unchanged, nothing more; what they mean is for the people reviewing them.'));
      if (!tampered) pkg.append(h('div', { class: 'stamp', 'data-stamp': id }, `SEALED · ${id} · v${v}`));
      if (opts.onDone) opts.onDone(!tampered);
    }, gap * (lines.length + 1));
  }

  function claimsAccess(page) {
    const act = D.grants.filter(g => g.active), next = act.map(g => g.until).sort()[0];
    page.append(pageHead('Claims · access', `${act.length} outside part${act.length === 1 ? 'y' : 'ies'} can see a package${next ? `, until ${day(next)}` : ''}.`, 'Each sees one claim’s package until a date, never the rest of the footage. Every view, hold and export is in a log nobody can edit.', ['Download the custody log', () => toast('custody.csv: every row chained to the one before')]));
    page.append(tbl([
      ['Outside party', 'minmax(0, 1fr)', 'txt', g => h('span', { class: 'tb-title' }, g.to)],
      ['Claim', '78px', 'txt', g => h('span', { class: 'tc' }, g.claim), true],
      ['Last seen', '260px', 'txt', g => h('span', { class: 'tc' }, g.last), true],
      ['Until', '90px', 'num', g => day(g.until).slice(4)],
      ['Ends in', '80px', 'num', g => g.active ? `${daysBetween(D.today, g.until)} d` : 'ended']
    ], D.grants, g => go('claims', { sub: 'files', claim: g.claim })));
    const seeable = act.map(g => ({ g, c: D.claims.find(x => x.id === g.claim) })).filter(x => x.c && x.c.export);
    if (seeable.length) page.append(h('div', { class: 'actions' }, seeable.map(({ g, c }) => h('button', { class: 'pill', type: 'button', onclick: () => { location.hash = 'package/' + c.export; } }, `See what ${g.to.split(' · ')[0].split('@')[0]} sees →`))));
    page.append(h('div', { class: 'label group-h' }, 'Log · newest first'), tbl([
      ['When', '130px', 'txt', x => h('span', { class: 'tc' }, `${day(x.at.slice(0, 10))} ${x.at.slice(11)}`)],
      ['What', 'minmax(0, 1fr)', 'txt', x => h('span', null, h('span', { class: 'tb-title' }, x.what), h('span', { class: 'tb-sub' }, x.who))],
      ['On', '220px', 'num', x => x.target, true]
    ], D.custody.slice(0, 7)));
  }

  /* ---------------- OUTSIDE: the package as the adjuster sees it (link only, view only, verified on open) ---------------- */
  function packagePage(page, exportId) {
    const c = D.claims.find(x => x.export === exportId) || D.claims.find(x => x.id === D.exportPackage.claim);
    const g = D.grants.find(x => x.claim === c.id && x.active) || D.grants.find(x => x.claim === c.id);
    const who = g ? g.to.split(' · ')[0] : 'Outside reviewer', shifts = claimShifts(c), v = c.version || 1;
    const isView = x => x.target === c.export && /\(outside, package only\)/.test(x.who);
    page.append(h('div', { class: 'ext-head' },
      h('div', { class: 'label' }, `Shared with ${who} (sample) · view only · ${g && g.active ? `ends ${day(g.until)}` : 'access ended'}`),
      h('h2', null, `${c.id} · ${c.title}`),
      h('p', { class: 'lede', style: { maxWidth: '64ch' } }, `From Arden Builders, Harbor Street Residences (sample site). This link shows ${c.export} v${v} and nothing else. Your views are logged and visible to the sender.`),
      h('div', { class: 'honest', id: 'pkg-status' }, h('span', null, `${c.moments.length} exhibits`), h('span', { id: 'pkg-viewed' }), h('span', { class: 'warn', id: 'pkg-verified' }, 'Verifying…'))));
    if (!g || !g.active) { page.append(h('div', { class: 'silent' }, h('p', null, 'This link no longer works. Ask the sender for a new one.'))); return; }
    const viewedAt = {};
    D.custody.filter(x => isView(x) && /exhibit (\d+)/.test(x.what)).forEach(x => { const k = x.what.match(/exhibit (\d+)/)[1]; if (!viewedAt[k] || x.at < viewedAt[k]) viewedAt[k] = x.at; });
    const exhibits = h('div'), activity = h('div', { class: 'rows', id: 'pkg-activity' });
    const draw = () => {
      $('#pkg-viewed') && ($('#pkg-viewed').textContent = `${Object.keys(viewedAt).length} of ${c.moments.length} viewed by you`);
      exhibits.innerHTML = '';
      c.moments.forEach((id, i) => { const e = D.eventById[id], vAt = viewedAt[i + 1];
        const cl = clip(e); cl.onclick = () => { viewer(e); if (!viewedAt[i + 1]) { viewedAt[i + 1] = `${D.today}T${NOW}`; D.custody.unshift({ at: `${D.today}T${NOW}`, who: `${who} adjuster (outside, package only)`, what: `Viewed exhibit ${i + 1} in the shared package`, target: c.export }); g.last = `${day(D.today)} ${NOW} · viewed exhibit ${i + 1}`; draw(); } };
        exhibits.append(h('div', { class: 'ex', 'data-ex': i + 1 }, cl,
          h('span', null, h('span', { class: 'tc' }, `Exhibit ${i + 1} · ${day(e.day)} ${hhmm(e.t)}`), h('div', { style: { fontSize: '16px', lineHeight: 1.4, marginTop: '4px' } }, e.what), e.review === 'confirmed' ? null : h('span', { class: 'chip ai', style: { marginTop: '6px' } }, 'AI, unreviewed')),
          h('span', { class: 'seen' + (vAt ? ' on' : '') }, vAt ? `✓ Viewed ${day(vAt.slice(0, 10)).slice(4)} ${vAt.slice(11)}` : 'Not viewed yet'))); });
      activity.innerHTML = '';
      const mine = D.custody.filter(isView);
      (mine.length ? mine : [{ at: '', what: 'Nothing yet' }]).forEach(x => activity.append(row(x.at ? `${day(x.at.slice(0, 10)).slice(4)} ${x.at.slice(11)}` : '—', x.what, null, null)));
    };
    const vbox = h('div');
    page.append(h('div', { class: 'ext-grid' },
      h('div', null,
        h('div', { class: 'label', style: { marginBottom: '6px' } }, 'Exhibits · open one to view it'), h('div', { style: { borderTop: '1px solid var(--ink)' } }, exhibits),
        h('div', { class: 'stock' }, 'Stock footage. Customer footage stays private.'),
        h('div', { class: 'label group-h' }, 'Your activity on this package'), activity,
        h('div', { class: 'actions' }, h('button', { class: 'pill', type: 'button', onclick: () => { D.custody.unshift({ at: `${D.today}T${NOW}`, who: `${who} adjuster (outside, package only)`, what: 'Downloaded the package', target: c.export }); draw(); toast(`${c.export}.zip · watermarked · download logged`); } }, 'Download the package'),
          h('button', { class: 'pill quiet', type: 'button', onclick: () => toast('verify.py · runs offline, prints PASS or FAIL per check') }, 'Get verify.py'))),
      vbox));
    draw();
    verifyRun(vbox, c, shifts, false, { noScroll: true, fast: true, title: 'Checked when you opened it.', line: 'We ran the same offline verifier you can run yourself. The package hash was emailed to you separately, so a rebuilt package can’t pass.',
      onDone: ok => { const el = $('#pkg-verified'); if (el) { el.textContent = ok ? `Verified on open · PASS · ${day(D.today)} ${NOW}` : 'Verification failed'; el.classList.toggle('warn', !ok); } } });
  }

  /* ---------------- router ---------------- */
  const TABS = {
    ask: { subs: null, render: (p, st) => st.q ? askAnswer(p, st) : askHome(p) },
    record: { subs: [['upload', 'Upload'], ['marks', 'Marks'], ['shifts', 'Shifts'], ['coverage', 'Coverage'], ['safety', 'Safety']], render: (p, st) => ({ upload: recordUpload, shifts: recordShifts, marks: recordMarks, coverage: recordCoverage, safety: recordSafety })[st.sub || 'upload'](p, st) },
    claims: { subs: [['files', 'Claim files'], ['access', 'Access']], render: (p, st) => ({ files: claimsFiles, access: claimsAccess })[st.sub || 'files'](p, st) }
  };
  const state = { ask: {}, record: { sub: 'upload' }, claims: { sub: 'files' } };
  function go(tab, patch) {
    Object.assign(state[tab], patch || {});
    if (tab === 'ask' && patch && patch.q && !patch.sub) state.ask.sub = 'answer';
    if (location.hash.slice(1) !== tab) location.hash = tab; else render();
  }
  function render() {
    const parts = location.hash.slice(1).split('/');
    let tab = parts[0];
    const outside = tab === 'package';
    document.body.classList.toggle('outside', outside);
    $('#wm').setAttribute('href', outside ? location.hash : '#ask');
    { const sn = $('#site-name'); if (sn) sn.textContent = 'Harbor Street Residences · sample site'; }
    const page = $('#page'); page.classList.remove('enter'); void page.offsetWidth; page.innerHTML = '';
    if (outside) {
      $('#subbar').hidden = true; document.body.classList.remove('home');
      packagePage(page, parts[1] ? decodeURIComponent(parts[1]) : D.exportPackage.id);
      page.classList.add('enter'); window.scrollTo(0, 0); return;
    }
    if (!TABS[tab]) tab = 'ask';
    document.querySelectorAll('.tabs a, .bnav a').forEach(a => a.dataset.tab === tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    const st = state[tab], def = TABS[tab];
    document.body.classList.toggle('home', tab === 'ask' && !st.q);
    $('#top-q').value = tab === 'ask' && st.q ? st.q : '';
    const subs = tab === 'ask' && st.q && !route(st.q).needs ? [['answer', 'Answer'], ['sources', 'Sources']] : def.subs;
    const bar = $('#subbar'), tabs = $('#subtabs'); bar.hidden = !subs; tabs.innerHTML = '';
    if (subs) subs.forEach(([k, l]) => tabs.append(h('button', { type: 'button', role: 'tab', 'aria-selected': String((st.sub || subs[0][0]) === k),
      onclick: () => { st.sub = k; if (tab === 'record') { st.shift = null; st.mark = null; } if (tab === 'claims') { st.claim = null; st.exporting = false; } render(); } }, l)));
    def.render(page, st); page.classList.add('enter'); window.scrollTo(0, 0);
  }
  const onTab = e => { const a = e.target.closest('a'); if (!a) return; const t = a.dataset.tab;
    if (location.hash.slice(1) === t) { e.preventDefault(); if (t === 'ask') state.ask = {}; if (t === 'record') state.record = { sub: 'marks' }; if (t === 'claims') state.claims = { sub: 'files' }; render(); } };
  document.querySelector('.tabs').addEventListener('click', onTab);
  $('#bnav').addEventListener('click', onTab);
  $('#wm').addEventListener('click', e => { if (document.body.classList.contains('outside')) { e.preventDefault(); return; } state.ask = {}; if (location.hash.slice(1) === 'ask') { e.preventDefault(); render(); } });
  $('#mark-btn').addEventListener('click', () => markSheet());
  $('#fab').addEventListener('click', () => markSheet());
  $('#top-lynx').addEventListener('submit', ev => { ev.preventDefault(); ask($('#top-q').value); });
  /* keys layer (from B), hidden until ? */
  document.addEventListener('keydown', ev => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey || document.body.classList.contains('outside')) return;
    const typing = /^(input|textarea|select)$/i.test(ev.target.tagName);
    if (typing || document.querySelector('.sheet,.viewer')) return;
    if (ev.key === '/') { ev.preventDefault(); ($('#ask-home') || $('#ask-top') || $('#top-q'))?.focus(); }
    else if (ev.key === 'm' || ev.key === 'M') { ev.preventDefault(); markSheet(); }
    else if (ev.key === 'h' || ev.key === 'H') { const b = $('[data-act="hold"]'); if (b) { ev.preventDefault(); b.click(); } }
    else if (ev.key === '?') { ev.preventDefault(); sheet('Keys', h('div', { class: 'keys-grid' },
      [['/', 'Ask Lynx'], ['M', 'Mark this moment'], ['H', 'Hold + export the window in an answer'], ['Esc', 'Close a sheet or a clip'], ['?', 'This list']].map(([k, t]) => [h('span', null, kbd(k)), h('span', null, t)])), null, null); }
  });
  window.addEventListener('hashchange', () => { document.querySelectorAll('.sheet,.viewer').forEach(x => x.remove()); render(); });
  render();
})();
</script>
</body>
